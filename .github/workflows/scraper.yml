name: Stock Scraper Schedule

# 스크래핑·AI·심 전부 + **버즈 필요 심의 매매**를 담당한다.
#
# [2026-08-08] 태스커가 더 이상 이 워크플로를 직접 부르지 않는다.
# 태스커 → trading.yml → (10분 격자일 때만) 이 워크플로.
#
# 방향을 뒤집은 이유: 예전에는 태스커 → scraper.yml이었고 매매가 그 안에서
# 곁다리로 돌았는데, 4분짜리 스크래핑 런이 도는 동안 들어온 2분 트리거가
# concurrency에 밀려 취소됐다 — 08-07 실측 196런 중 26런(13%)이 그렇게 사라졌고,
# 그만큼 매매 사이클이 통째로 없어졌다. 이제 매매가 상위에 있어 스크래핑에
# 막히지 않고, 스크래퍼가 죽어도 매매와 국면은 산다.
#
# GitHub cron은 쓰지 않는다 — 발화가 수 분~수 시간 밀려 태스커 런과 겹쳤고,
# 두 런이 연달아 네이버를 두드리면 페이지 수집이 무너졌다
# (docs/SCRAPER_OPERATION_SPEC.md). 장 마감 후 수집은 eod_data.yml이 맡는다.
#
# **국면(sim_libero_state.json)은 여기서 갱신하지 않는다.** writer는 trade_loop
# 하나다 — 국면은 최근 5회 관측의 과반으로 확정되므로 두 곳에서 갱신하면 같은
# 순간이 두 번 누적되어 평활이 왜곡된다. 여기서는 읽기만 한다.
on:
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Bypass market holiday check'
        required: false
        default: 'false'
      regime:
        # trade_loop가 방금 갱신한 국면. 파일(db-data)로 읽으면 이 런이 체크아웃하는
        # 시점이 trade_loop의 배포보다 빨라 **항상 한 격자 낡은 값**이 온다.
        # Sim10처럼 국면이 매매 소유자를 바꾸는 심에서는 그 어긋남이 국면 전환
        # 격자에 이중 주문이나 무주문이 된다. 비어 있으면(수동 실행) 파일을 쓴다.
        description: 'Regime handed over by trading.yml (blank = read from file)'
        required: false
        default: ''
  # 태스커가 repository_dispatch로 바뀌는 경우를 위해 남겨둔다(현재 미사용).
  repository_dispatch:
    types: [tasker_trigger_scrape]

# trading.yml과는 **일부러 그룹을 공유하지 않는다** — 같은 그룹에 넣으면 매매의
# 대기 트리거가 새 디스패치에 밀려 취소되어 매매 사이클이 조용히 사라진다
# (GitHub concurrency는 FIFO 큐가 아니라 "실행 중 1개 + 대기 1개"만 유지한다).
# 두 워크플로가 동시에 도는 경우의 안전은 원장 락(program_trader)과 배포 파일
# 분리가 책임진다.
concurrency:
  group: stockbot-scraper
  cancel-in-progress: false

jobs:
  scrape-and-report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
      TZ: Asia/Seoul
    permissions:
      contents: write
    steps:
      - name: Checkout content
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements-scraper.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f scripts/requirements-scraper.txt ]; then pip install -r scripts/requirements-scraper.txt; fi

      - name: Fetch remote data (db-data)
        run: |
          # --depth 1: 필요한 건 최신 스냅샷뿐이다. db-data는 하루 수십~수백 커밋이
          # 쌓이는 브랜치(2026-08 기준 335커밋·33MB)라, 이 워크플로가 2분마다 도는
          # 지금 전체 이력을 받으면 그 비용이 매 트리거마다 든다.
          git fetch --depth 1 origin db-data:db-data 2>/dev/null || echo "[Info] db-data branch does not exist yet"
          if git show-ref --verify refs/heads/db-data 2>/dev/null; then
            git checkout db-data -- data/ 2>/dev/null || echo "[Info] No data folder on db-data yet"
          fi
          mkdir -p data
          # 필수 파일 부재 시 기본 구조로 생성 (유실 방지)
          [ -f data/reservations.json ] || echo "[]" > data/reservations.json
          [ -f data/order_history.json ] || echo "[]" > data/order_history.json
          [ -f data/reports.json ] || echo "[]" > data/reports.json
          # 토큰은 비공개 레포(stockbot-secret)에서 인증 조회한다 (db-data에 두지 않음)
          # output/의 KOSPI CSV는 main에 커밋된 옛 스냅샷이다. db-data 최신본으로 덮어써야
          # 갱신을 건너뛴 장중 런의 배포 스텝이 db-data를 과거로 되돌리지 않는다.
          mkdir -p output
          [ -f data/kospi_top100_close.csv ] && cp data/kospi_top100_close.csv output/ || true
          echo "[System] Remote data synchronized and verified."

      - name: Fetch private trade state (stockbot-secret)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          # 실거래 누적 기록은 비공개 레포에서 가져온다 (public db-data에는 없음)
          # program_positions.json(프로그램 원장)은 program_trader.py가 API로 직접 읽고 쓰므로 제외
          # (clone/push 실패 시 백지 원장으로 중복 매수하던 사고 방지 — fail-closed는 코드 쪽에서 강제)
          if git clone --depth 1 https://x-access-token:${GH_PAT}@github.com/hoonnamkoong/stockbot-secret.git secret_repo 2>/dev/null; then
            for f in order_history.json trade_history_real.csv; do
              [ -f "secret_repo/$f" ] && cp "secret_repo/$f" "data/$f" && echo "[Private] fetched $f"
            done
            rm -rf secret_repo
          else
            echo "[Private] secret repo clone 실패 또는 비어있음 (최초 실행 가능)"
          fi

      - name: Manage KIS Token
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          GH_PAT: ${{ secrets.GH_PAT }}
          FORCE_TOKEN_REFRESH: ${{ github.event.inputs.force_token_refresh || 'false' }}
        run: python scripts/token_manager.py

      - name: Run Scraper
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ACCOUNT_NO: ${{ secrets.KIS_ACCOUNT_NO }}
          KIS_APP_ACCOUNT: ${{ secrets.KIS_ACCOUNT_NO }}
          GH_PAT: ${{ secrets.GH_PAT }}
          FORCE_RUN: "${{ github.event.inputs.force_run }}"
          REGIME_HINT: "${{ github.event.inputs.regime }}"
          GITHUB_EVENT_NAME: "${{ github.event_name }}"
        run: PYTHONPATH=. python scripts/scraper.py

      - name: Deploy Data to db-data branch
        if: success()
        run: |
          # [V8.9.9.17] Git 설정 및 안정적 동기화
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          
          # 별도 디렉토리에 db-data 브랜치 체크아웃
          # --depth 1: 여기서 하는 일은 "최신 위에 커밋 하나 얹어 push"뿐이라 이력이
          # 필요 없다. 이 워크플로가 2분마다 돌게 된 지금은 매 트리거 비용이다.
          git clone --depth 1 --branch db-data https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git db_data_repo || {
            mkdir db_data_repo
            cd db_data_repo
            git init
            git checkout -b db-data
            cd ..
          }
          
          # 최신 데이터 업데이트
          mkdir -p db_data_repo/data/reports
          # [Security] 민감/자격증명/실계좌 파일은 public db-data로 내보내지 않는다.
          #   - 토큰류: 비공개 레포 stockbot-secret 전담
          #   - 실거래 기록(order_history/trade_history_real/history): 비공개 레포 라운드트립
          #   - 스냅샷(portfolio/order_status): writer 없음 → 미배포
          #
          # [소유권] sim_libero_state.json / trade_history_sim_libero.csv /
          # regime_observations*.csv(월별 분할 포함) 는 **trading.yml이 유일 writer다.**
          # 여기서 올리면 이 런이 시작할 때 받아온 사본으로 국면을 되돌린다 —
          # 두 워크플로는 concurrency 그룹이 달라 실제로 동시에 돌기 때문에
          # 그 되돌림이 상시 일어난다(lost update). 여기서는 읽기만 한다.
          # [소유권 — 런타임] 선택 심의 페이퍼 쌍둥이는 trading.yml이 60초마다
          # 갱신·배포한다. 어느 심인지는 program_trading.json이 정하므로 아래 정적
          # case문에 못 넣는다 — 이 런이 실행 중에 적어둔 목록을 읽는다
          # (src/pipeline/orchestrator.write_deploy_exclude).
          # Stage 3에서 안 돌리는 것만으로는 부족하다: 이 cp는 심을 돌렸는지와
          # 무관하게 **런 시작 시점 사본**을 올려, 그 사이 trading.yml이 push한
          # 4~5분치 페이퍼 매매를 되돌린다(lost update).
          EXCLUDE_LIST=data/.scraper_deploy_exclude
          owned_by_trading() {
            [ -s "$EXCLUDE_LIST" ] && grep -qxF "$1" "$EXCLUDE_LIST"
          }

          for f in data/*.json; do
            if owned_by_trading "$(basename "$f")"; then continue; fi
            case "$(basename "$f")" in
              kis_token_cache.json|token.json|kis_token.json|token_result.json|portfolio.json|order_history.json|order_status.json|history.json|program_positions.json|program_trading.json) continue ;;
              sim_libero_state.json|regime_gate_state.json) continue ;;
              # 순위 스냅샷도 trading.yml이 유일 writer다. 되돌리면 직전 스냅샷이
              # 사라져 매 사이클이 warmup이 되고 delta가 영원히 빈다.
              rank_state.json) continue ;;
            esac
            cp "$f" db_data_repo/data/ 2>/dev/null || true
          done
          # 실거래 CSV는 비공개 레포로만 (public 배포 제외)
          for f in data/*.csv; do
            if owned_by_trading "$(basename "$f")"; then continue; fi
            case "$(basename "$f")" in
              trade_history_real.csv) continue ;;
              regime_observations*.csv|trade_history_sim_libero.csv) continue ;;
              money_*.csv) continue ;;   # 순위 스냅샷 — writer는 trading.yml
            esac
            cp "$f" db_data_repo/data/ 2>/dev/null || true
          done
          # KOSPI top100 종가 CSV는 eod_data.yml이 소유한다 (여기서 배포하지 않는다).
          cp -r data/*.xlsx db_data_repo/data/ 2>/dev/null || true
          cp -r data/reports/* db_data_repo/data/reports/ 2>/dev/null || true
          
          # [V50.2 Security] Secret Scanning 방지를 위해 .env 파일 및 기타 민감 파일 삭제
          find db_data_repo -name ".env*" -delete
          find db_data_repo -name "*.bak*" -delete
          
          # 변경사항 반영
          cd db_data_repo
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "[V8.9.9.17] Automated Data Update: $(date +'%Y-%m-%d %H:%M KST')"
            # trading.yml이 60~90초 간격으로 같은 브랜치에 쓰므로 non-fast-forward가
            # 흔하다. 남의 커밋을 덮어쓰지 않고 그 위에 얹어 재시도한다
            # (trading.yml Deploy state 스텝과 동일 패턴 — shallow clone이라 unshallow 후 rebase).
            for i in 1 2 3; do
              if git push origin db-data; then
                echo "[Deploy] push 성공 (시도 $i)"
                break
              fi
              echo "[Deploy] push 충돌 — rebase 후 재시도 ($i/3)"
              git fetch --unshallow origin db-data 2>/dev/null || git fetch origin db-data
              git pull --rebase origin db-data || { echo "[Deploy] rebase 실패"; exit 1; }
              if [ "$i" = "3" ]; then echo "[Deploy] push 3회 실패"; exit 1; fi
            done
          else
            echo "No changes to commit"
          fi

      # 워크플로가 통째로 깨진 경우(파이썬 예외, 배포 실패, 의존성 설치 실패)의 유일한
      # 통보 경로다. 파이썬 안에서 난 장애는 src/alerts.py가 직접 보내지만, 파이썬이
      # 시작조차 못 했으면 그쪽은 돌지 않는다.
      #
      # cancelled에는 걸리지 않는다(if: failure()). 2분 트리거가 스크래핑 런과 겹칠 때
      # concurrency가 대기 런을 취소하는 건 정상 동작이라 알릴 게 없다.
      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="HTML" \
            -d text="🚨 <b>StockBot 스크래퍼 실패</b>%0A%0A워크플로 런이 실패했습니다.%0A${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            || echo "[Notify] 텔레그램 발송 실패"

      # [2026-08-06] 실거래 기록(order_history.json, trade_history_real.csv)의 git 배포를
      # 걷어냈다. 이 파일들의 writer 워크플로가 선택 심에 따라 바뀌기 때문이다 —
      # 버즈 불필요 심이면 trading.yml(60초 루프)이, 버즈 필요 심이면 이 워크플로가
      # 주문을 낸다. 양쪽이 각자 런 시작 시점의 사본을 밀면 나중에 끝난 쪽이 먼저
      # 기록된 체결을 덮어써 지운다(lost update).
      #
      # 대신 주문을 낸 프로세스가 GitHub contents API로 직접 덧붙인다
      # (src/trade/secret_store.py). program_positions.json이 이미 같은 이유로
      # 같은 방식을 쓴다 — writer 경로가 하나면 레이스가 생길 곳이 없다.

