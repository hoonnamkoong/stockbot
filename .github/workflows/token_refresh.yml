name: Fast Token Refresh

on:
  repository_dispatch:
    types: [refresh_token]
  workflow_dispatch:
    # Manual trigger allowed

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Manage KIS Token
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          FORCE_TOKEN_REFRESH: 'true'
        run: python scripts/token_manager.py

      - name: Deploy Token to db-data branch
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          # [Fix] db-data를 별도 디렉토리에 clone (작업트리 checkout 충돌 회피 - scraper.yml과 동일 방식)
          git clone --branch db-data https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git db_data_repo

          # 방금 발급된 토큰 캐시만 복사
          cp data/kis_token_cache.json db_data_repo/data/kis_token_cache.json

          cd db_data_repo
          git add data/kis_token_cache.json
          git commit -m "🚑 [V8.9.9.44] Fast Token Refresh: Update KIS token cache" || echo "No changes to commit"
          git push origin db-data
