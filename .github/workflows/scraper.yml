name: Stock Scraper Schedule


on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'data/**'
      - 'trending_*.csv'
      - 'trending_*.xlsx'
      - 'reports.json'
      - '*.md'


jobs:
  scrape-and-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Check if market is closed (Weekend or Holiday)
        id: market_check
        run: |
          pip install holidays
          
          python3 << 'EOF'
          import holidays
          from datetime import datetime
          import os
          
          kr_holidays = holidays.KR()
          today = datetime.now()
          day_of_week = today.weekday()  # 0=Mon, 6=Sun
          
          is_weekend = day_of_week >= 5  # 5=Sat, 6=Sun 
