name: Fast Token Refresh

on:
  schedule:
    # KIS 1일 1회 발급 원칙 준수: 평일 장 시작 전 1회 선발급 (KST 08:30 = UTC 23:30 전일)
    - cron: '30 23 * * 0-4'  # Sun-Thu UTC = Mon-Fri 08:30 KST
  repository_dispatch:
    types: [refresh_token]
  workflow_dispatch:
    # Manual trigger allowed

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      # token_manager가 토큰을 발급하고 비공개 레포(stockbot-secret)에 직접 기록한다.
      # public db-data로의 push는 더 이상 없다(자격증명 노출 제거).
      - name: Manage KIS Token
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          GH_PAT: ${{ secrets.GH_PAT }}
          FORCE_TOKEN_REFRESH: 'true'
        run: python scripts/token_manager.py
