name: Sentinel-V AI Trader

on:
  schedule:
    - cron: '30 3 * * 1-5'  # 매일(월-금) 12:30 KST
  workflow_dispatch:      # 수동 실행 허용

jobs:
  ai_trading:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f scripts/requirements-scraper.txt ]; then pip install -r scripts/requirements-scraper.txt; fi

      - name: Run Sentinel-V Core
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          export PYTHONPATH=${PYTHONPATH}:$(pwd)
          python -m src.features.sentinel_v

      - name: Deploy Data to db-data branch
        if: always()
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          if [ -d "data" ]; then
            git fetch origin db-data:db-data || git checkout --orphan db-data
            git checkout db-data
            cp -r data/* .
            git add .
            git commit -m "Auto-update data from Sentinel-V [$(date +'%Y-%m-%d %H:%M:%S KST')]" || echo "No changes"
            git push origin db-data
          fi
