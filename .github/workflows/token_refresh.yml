name: Fast Token Refresh

on:
  # 토큰 선발급은 Tasker → /api/cron(평일 07:00 KST)이 담당한다.
  # GitHub cron은 발화가 최대 수시간 지연되어 장 전 발급을 보장하지 못해 제거함.
  repository_dispatch:
    types: [refresh_token]
  workflow_dispatch:
    # Manual trigger allowed

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      # token_manager가 토큰을 발급하고 비공개 레포(stockbot-secret)에 직접 기록한다.
      # public db-data로의 push는 더 이상 없다(자격증명 노출 제거).
      - name: Manage KIS Token
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          GH_PAT: ${{ secrets.GH_PAT }}
          FORCE_TOKEN_REFRESH: 'true'
        run: python scripts/token_manager.py
