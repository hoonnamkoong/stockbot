name: Stock Scraper Schedule

# 스크래퍼는 태스커 신호로만 돈다 (docs/SCRAPER_OPERATION_SPEC.md).
# GitHub cron은 발화가 수 분~수 시간 밀려 태스커 런과 겹쳤고, 두 런이 연달아
# 네이버를 두드리면 페이지 수집이 무너졌다. 장 마감 후 데이터 수집은 eod_data.yml이 맡는다.
#
# [2026-08-07] 태스커가 이 이벤트(tasker_trigger)를 2분마다 보낸다(trading_lite.yml과
# 공유). 실제로 스크래핑을 도는 건 그중 10분에 한 번뿐이다 — 나머지는 파이썬 쪽
# 게이트(src/pipeline/scrape_gate.py)가 곧바로 종료시킨다. 그래야 게시글 수집
# 빈도(=네이버 부하)가 늘지 않고, 국면(regime_history)도 사이클당 한 번만 갱신된다.
# 오프틱 매매는 trading_lite.yml이 같은 트리거로 독립적으로 처리한다.
on:
  repository_dispatch:
    types: [tasker_trigger]
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Bypass market holiday check'
        required: false
        default: 'false'

# 이 워크플로끼리는 겹치지 않게 한다(10분 주기라 평소엔 겹칠 일이 없지만, 수동 실행이
# 태스커 런과 겹치면 db-data push가 부딪힌다). trading_lite.yml과는 **일부러 그룹을
# 공유하지 않는다** — 같은 그룹에 넣으면 lite의 대기 트리거가 새 디스패치에 밀려
# 취소되어 2분 거래 사이클이 조용히 사라진다(GitHub concurrency는 FIFO 큐가 아니라
# "실행 중 1개 + 대기 1개"만 유지한다). 두 워크플로가 동시에 도는 경우의 안전은
# 원장 락(program_trader)과 배포 파일 분리가 책임진다.
concurrency:
  group: stockbot-scraper
  cancel-in-progress: false

jobs:
  scrape-and-report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
      TZ: Asia/Seoul
    permissions:
      contents: write
    steps:
      - name: Checkout content
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements-scraper.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f scripts/requirements-scraper.txt ]; then pip install -r scripts/requirements-scraper.txt; fi

      - name: Fetch remote data (db-data)
        run: |
          git fetch origin db-data:db-data 2>/dev/null || echo "[Info] db-data branch does not exist yet"
          if git show-ref --verify refs/heads/db-data 2>/dev/null; then
            git checkout db-data -- data/ 2>/dev/null || echo "[Info] No data folder on db-data yet"
          fi
          mkdir -p data
          # 필수 파일 부재 시 기본 구조로 생성 (유실 방지)
          [ -f data/reservations.json ] || echo "[]" > data/reservations.json
          [ -f data/order_history.json ] || echo "[]" > data/order_history.json
          [ -f data/reports.json ] || echo "[]" > data/reports.json
          # 토큰은 비공개 레포(stockbot-secret)에서 인증 조회한다 (db-data에 두지 않음)
          # output/의 KOSPI CSV는 main에 커밋된 옛 스냅샷이다. db-data 최신본으로 덮어써야
          # 갱신을 건너뛴 장중 런의 배포 스텝이 db-data를 과거로 되돌리지 않는다.
          mkdir -p output
          [ -f data/kospi_top100_close.csv ] && cp data/kospi_top100_close.csv output/ || true
          echo "[System] Remote data synchronized and verified."

      - name: Fetch private trade state (stockbot-secret)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          # 실거래 누적 기록은 비공개 레포에서 가져온다 (public db-data에는 없음)
          # program_positions.json(프로그램 원장)은 program_trader.py가 API로 직접 읽고 쓰므로 제외
          # (clone/push 실패 시 백지 원장으로 중복 매수하던 사고 방지 — fail-closed는 코드 쪽에서 강제)
          if git clone --depth 1 https://x-access-token:${GH_PAT}@github.com/hoonnamkoong/stockbot-secret.git secret_repo 2>/dev/null; then
            for f in order_history.json trade_history_real.csv; do
              [ -f "secret_repo/$f" ] && cp "secret_repo/$f" "data/$f" && echo "[Private] fetched $f"
            done
            rm -rf secret_repo
          else
            echo "[Private] secret repo clone 실패 또는 비어있음 (최초 실행 가능)"
          fi

      - name: Manage KIS Token
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          GH_PAT: ${{ secrets.GH_PAT }}
          FORCE_TOKEN_REFRESH: ${{ github.event.inputs.force_token_refresh || 'false' }}
        run: python scripts/token_manager.py

      - name: Run Scraper
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ACCOUNT_NO: ${{ secrets.KIS_ACCOUNT_NO }}
          KIS_APP_ACCOUNT: ${{ secrets.KIS_ACCOUNT_NO }}
          GH_PAT: ${{ secrets.GH_PAT }}
          FORCE_RUN: "${{ github.event.inputs.force_run }}"
          GITHUB_EVENT_NAME: "${{ github.event_name }}"
        run: PYTHONPATH=. python scripts/scraper.py

      - name: Deploy Data to db-data branch
        if: success()
        run: |
          # [V8.9.9.17] Git 설정 및 안정적 동기화
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          
          # 별도 디렉토리에 db-data 브랜치 체크아웃
          git clone --branch db-data https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git db_data_repo || {
            mkdir db_data_repo
            cd db_data_repo
            git init
            git checkout -b db-data
            cd ..
          }
          
          # 최신 데이터 업데이트
          mkdir -p db_data_repo/data/reports
          # [Security] 민감/자격증명/실계좌 파일은 public db-data로 내보내지 않는다.
          #   - 토큰류: 비공개 레포 stockbot-secret 전담
          #   - 실거래 기록(order_history/trade_history_real/history): 비공개 레포 라운드트립
          #   - 스냅샷(portfolio/order_status): writer 없음 → 미배포
          for f in data/*.json; do
            case "$(basename "$f")" in
              kis_token_cache.json|token.json|kis_token.json|token_result.json|portfolio.json|order_history.json|order_status.json|history.json|program_positions.json|program_trading.json) continue ;;
            esac
            cp "$f" db_data_repo/data/ 2>/dev/null || true
          done
          # 실거래 CSV는 비공개 레포로만 (public 배포 제외)
          for f in data/*.csv; do
            [ "$(basename "$f")" = "trade_history_real.csv" ] && continue
            cp "$f" db_data_repo/data/ 2>/dev/null || true
          done
          # KOSPI top100 종가 CSV는 eod_data.yml이 소유한다 (여기서 배포하지 않는다).
          cp -r data/*.xlsx db_data_repo/data/ 2>/dev/null || true
          cp -r data/reports/* db_data_repo/data/reports/ 2>/dev/null || true
          
          # [V50.2 Security] Secret Scanning 방지를 위해 .env 파일 및 기타 민감 파일 삭제
          find db_data_repo -name ".env*" -delete
          find db_data_repo -name "*.bak*" -delete
          
          # 변경사항 반영
          cd db_data_repo
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "[V8.9.9.17] Automated Data Update: $(date +'%Y-%m-%d %H:%M KST')"
            git push origin db-data
          else
            echo "No changes to commit"
          fi

      # [2026-08-06] 실거래 기록(order_history.json, trade_history_real.csv)의 git 배포를
      # 걷어냈다. 이 파일들의 writer 워크플로가 선택 심에 따라 바뀌기 때문이다 —
      # 버즈 불필요 심이면 trading_lite.yml(2분)이, 버즈 필요 심이면 이 워크플로가
      # 주문을 낸다. 양쪽이 각자 런 시작 시점의 사본을 밀면 나중에 끝난 쪽이 먼저
      # 기록된 체결을 덮어써 지운다(lost update).
      #
      # 대신 주문을 낸 프로세스가 GitHub contents API로 직접 덧붙인다
      # (src/trade/secret_store.py). program_positions.json이 이미 같은 이유로
      # 같은 방식을 쓴다 — writer 경로가 하나면 레이스가 생길 곳이 없다.

