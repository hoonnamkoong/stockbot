name: Trading (실전 매매)

# 태스커가 **직접** 부르는 워크플로다. 실전 매매의 본체이며, 스크래핑은 여기서
# 필요할 때만 깨운다(scraper.yml dispatch).
#
# [2026-08-08] 방향을 뒤집었다. 예전에는 태스커 → scraper.yml이었고 매매가 그
# 안에서 곁다리로 돌았는데, 스크래핑이 매매를 세 가지 방식으로 방해했다.
#   1. concurrency 그룹이 같아, 4분짜리 스크래핑 런이 도는 동안 들어온 트리거가
#      대기열에 밀려 취소됐다 — 08-07 실측 196런 중 26런(13%)이 그렇게 사라졌다.
#   2. 같은 프로세스라 스크래핑이 느려지면 매매도 늦었다.
#   3. 스크래퍼가 죽으면 매매도 죽었다.
# 이제 매매가 상위에 있고 스크래퍼가 종속이다. 스크래퍼가 죽어도 매매와 국면은 산다.
#
# 태스커 간격은 2분 그대로다. 1분 매매는 런 하나가 셋업을 한 번만 내고 안에서
# 두 바퀴 도는 방식으로 얻는다(scripts/trade_loop.py 참고) — 새 런을 60초마다
# 띄우는 건 셋업만 20초라 물리적으로 불가능하다.
on:
  workflow_dispatch:
    inputs:
      force_run:
        # 휴장 판정(KIS chk-holiday)이 실패하면 이 워크플로가 매매도 스크래핑도
        # 하지 않고 멈춘다. 그때 사람이 되살리는 유일한 경로다 — 알림 문구가
        # 이 옵션을 안내한다(src/alerts.py). 켜면 실매수 주문이 나간다.
        description: 'Bypass market holiday check'
        required: false
        default: 'false'
  repository_dispatch:
    types: [tasker_trigger, tasker_trigger_trade]

# 스크래퍼와 **그룹을 공유하지 않는다.** 그게 이 분리의 핵심이다.
# cancel-in-progress: false — 진행 중인 런을 취소하면 주문 루프 한가운데서
# 죽어 락이 리스(4분) 만료까지 남는다. 루프 예산이 태스커 간격보다 짧아
# 정상적으로는 겹치지 않는다.
concurrency:
  group: stockbot-trading
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    # 원장 락 리스(_LOCK_LEASE_MIN=4분)보다 짧아야 한다. 리스가 만료될 때까지
    # 살아 있는 런이 있으면 다른 런이 락을 회수해 같은 주문을 낼 수 있다.
    timeout-minutes: 3
    env:
      PYTHONPATH: ${{ github.workspace }}
      TZ: Asia/Seoul
    permissions:
      contents: write
      # scraper.yml을 dispatch하려면 필요하다. workflow_dispatch와
      # repository_dispatch는 GitHub이 재귀 방지 규칙에서 예외로 둔 두 이벤트라
      # GITHUB_TOKEN으로도 새 런이 생성된다.
      actions: write
    steps:
      - name: Checkout content
        uses: actions/checkout@v3

      # ── 세션 라우팅 ────────────────────────────────────────────────
      # 태스커는 09:00~08:00 KST(다음날)에 2분 간격으로 `/api/cron`을 부르고,
      # 그 라우트가 거의 모든 틱을 이 워크플로로 보낸다. 예외는 07:00 KST의
      # **첫 틱 하나뿐**이다(토큰 선발급 → token_refresh.yml).
      # 어느 틱이 어디로 가는지는 src/lib/cron-target.ts가 정한다 —
      # **이 창을 넓힐 때는 그 파일부터 본다.** 2026-09-02에 창 끝을
      # 06:00 → 08:00으로 넓히자, 시(hour)만 보던 그 분기가 07시대 30틱을 전부
      # 토큰 발급으로 보냈다(KIS 26회 재발급 + 그 한 시간 매매 트리거 실종).
      # 이 주석이 "06:00"인 채로 남아 그 사고를 한 번 더 가렸다.
      # 미국 장중 루프를 GitHub 네이티브 cron으로 돌리던 방식이 2026-08-27부터
      # 통째로 죽었기 때문이다(발화 18 → 1 → 0건/일, 남은 런도 폐장 뒤라 즉시
      # 종료 — 목·금 세션 거래 0건). 실패가 아니라 미발화라 내내 초록이었다.
      #
      # 설치보다 **앞에** 둔다. 그 창의 절반 이상(15:50~22:30 KST)은 어느 장도
      # 아니라, 그 트리거들이 checkout만 하고 20초에 끝나야 한다. 그래서
      # session_router.py는 표준 라이브러리만 쓴다.
      # tee: 판정을 GITHUB_OUTPUT과 **로그에 동시에** 남긴다. 리다이렉트만 하면
      # "kr=false를 썼다"와 "아무것도 안 썼다"가 로그에서 똑같이 생긴다 — 둘 다
      # 하위 스텝이 전부 스킵된 런으로 보인다. 이 `if:`가 이제 장 밖에서 실전
      # 매매 루프가 도는 걸 막는 유일한 방벽이라 그 둘은 구분돼야 한다.
      - name: Route session
        id: route
        run: python3 scripts/session_router.py | tee -a "$GITHUB_OUTPUT"

      # 미국 심은 페이퍼다 — 실전 경로보다 먼저, 설치 없이(urllib) 끝낸다.
      # continue-on-error: 여기서 실패해도 아래 "실전 매매 실패" 알림이 울리면
      # 안 된다. 미국 쪽 침묵은 세션 밖 감지기가 따로 잡는다
      # (scripts/check_us_loop_fired.py).
      - name: Wake US trading loop
        if: steps.route.outputs.us == 'true'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python3 scripts/dispatch_us_trading.py

      # 장 마감 뒤 EOD 배치를 깨운다. eod_data.yml의 cron(`0 7 * * 1-5`)은 평소
      # 40~57분 지연이었는데 2026-08-27부터 11~12시간으로 벌어졌다. 그 배치는
      # 심9-1·심11의 **다음 세션 감시목록**을 만들기 때문에, 지연이 다음 09:00
      # KST를 넘기면 두 심이 그 세션을 통째로 잃는다.
      #
      # 창(16:00~17:00 KST)에 2분마다 트리거가 들어오지만 실제 dispatch는 한 번만
      # 나간다 — dispatch_eod_data.py가 '오늘 마감 뒤 런이 있나'를 먼저 본다.
      - name: Wake EOD batch
        if: steps.route.outputs.eod == 'true'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python3 scripts/dispatch_eod_data.py

      # 개장 직후 산출물 신선도 감사를 깨운다 — "실패했나"가 아니라 "나와야 할
      # 게 나왔나". cron 미발화(②)와 "성공했는데 산출물이 없다"(③)는 실패 알림으로
      # 안 잡힌다.
      #
      # 창(09:00~09:30 KST)에 2분마다 트리거가 오지만 dispatch_data_audit.py가
      # "오늘 이미 돌았나"를 먼저 봐서 하루 한 번만 나간다.
      # 미국장 마감 뒤 워치리스트 배치를 깨운다. 이 워크플로는 태스커 체인 밖의
      # 네이티브 cron(22:00 UTC) 전용이었고, 실측 지연이 +29분에서 +3~8시간으로
      # 벌어졌다. 그 지연이 2026-09-01에 배치를 scraper 창 안으로 밀어 넣어
      # 워치리스트가 되돌려지는 사고를 만들었다.
      #
      # 창(07:00~15:00 KST, 화~토)에 2분마다 트리거가 오지만 실제 dispatch는
      # dispatch_us_eod_watchlist.py가 정한다 — 성공했으면 생략, 실패면 25분
      # 간격으로 재시도, 상한 6회.
      - name: Wake US watchlist batch
        if: steps.route.outputs.watchlist == 'true'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python3 scripts/dispatch_us_eod_watchlist.py

      # 프리마켓·미국지수 적재도 같은 이유로 깨운다(cron 22:20 UTC, 실측 최대
      # +7시간 50분). 여기서는 지연이 곧 결손이다 — 국내 개장을 넘겨 도착하면
      # 그날 프리마켓 판단에 못 쓴다.
      - name: Wake premarket batch
        if: steps.route.outputs.premarket == 'true'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python3 scripts/dispatch_premarket_data.py

      # 주간 리포트(금 18:00 KST)도 같은 이유로 깨운다. cron 실측 지연이 +23분에서
      # +11시간 27분(08-28)까지 벌어졌고, 그날 리포트는 토요일 새벽에 도착했다.
      # 이 시각은 옛 태스커 창 안이라 프로파일 변경 없이도 동작한다.
      - name: Wake weekly report
        if: steps.route.outputs.weekly == 'true'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python3 scripts/dispatch_weekly_report.py

      - name: Wake data freshness audit
        if: steps.route.outputs.audit == 'true'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python3 scripts/dispatch_data_audit.py

      - name: Set up Python
        if: steps.route.outputs.kr == 'true'
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements-trade.txt'

      # 스크래퍼 requirements를 쓰지 않는다. pandas·sklearn·pyarrow·pdfplumber·
      # google-genai까지 깔면 설치에만 24초가 들고(08-07 실측), 그만큼 루프
      # 예산이 줄어 두 바퀴가 안 돈다 = 1분 매매가 2분 매매로 되돌아간다.
      - name: Install dependencies
        if: steps.route.outputs.kr == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements-trade.txt

      - name: Fetch remote data (db-data)
        if: steps.route.outputs.kr == 'true'
        run: |
          # --depth 1: 최신 스냅샷만 필요하다. 2분마다 도는 경로에서 전체 이력을
          # 받으면 그 비용이 매 트리거마다 든다(db-data는 하루 수십 커밋이 쌓인다).
          git fetch --depth 1 origin db-data:db-data 2>/dev/null || echo "[Info] db-data branch does not exist yet"
          if git show-ref --verify refs/heads/db-data 2>/dev/null; then
            git checkout db-data -- data/ 2>/dev/null || echo "[Info] No data folder on db-data yet"
          fi
          mkdir -p data
          # 리베로 trend(ADX 근사)는 output/kospi_top100_close.csv를 읽는다. 이 파일은
          # main에 없고 db-data의 data/ 아래에만 있다 — 08-08 매매/스크래핑 분리 때
          # 이 복사가 scraper.yml에만 남아 08-10부터 trend가 전량 결측이었고,
          # trend=0 폴백 탓에 국면이 SIDEWAYS로 고정됐다.
          mkdir -p output
          [ -f data/kospi_top100_close.csv ] && cp data/kospi_top100_close.csv output/ || true
          echo "[System] Remote data synchronized."

      - name: Manage KIS Token
        if: steps.route.outputs.kr == 'true'
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python scripts/token_manager.py

      - name: Run trade loop
        if: steps.route.outputs.kr == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ACCOUNT_NO: ${{ secrets.KIS_ACCOUNT_NO }}
          KIS_APP_ACCOUNT: ${{ secrets.KIS_ACCOUNT_NO }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_EVENT_NAME: "${{ github.event_name }}"
          FORCE_RUN: "${{ github.event.inputs.force_run }}"
        run: PYTHONPATH=. python scripts/trade_loop.py

      # 배포 대상은 이 워크플로가 실제로 쓴 것만이다. data/ 전체를 밀면 스크래퍼가
      # 방금 갱신한 파일(스크래핑 산출물·나머지 심 상태)을 런 시작 시점의 낡은
      # 사본으로 되돌린다 — 두 워크플로는 concurrency 그룹이 달라 동시에 돈다.
      #
      # 실거래 기록(program_positions.json / order_history.json /
      # trade_history_real.csv)은 여기 없다 — 주문 낸 프로세스가 GitHub API로 직접
      # 쓴다(src/trade/secret_store.py). 그래서 어느 워크플로가 주문했든 writer가 하나다.
      #
      # 국면 파일(sim_libero_state.json 등)은 이 워크플로가 유일 writer이므로
      # 매니페스트에 함께 들어간다(trade_loop가 갱신한 사이클에 한해).
      - name: Deploy state (db-data)
        if: success() && steps.route.outputs.kr == 'true'
        run: |
          if [ ! -f data/.lite_deploy_manifest ]; then
            echo "[Deploy] 배포 목록 없음 — 생략"
            exit 0
          fi
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

          # 스크래퍼가 그 사이 push했으면 non-fast-forward가 난다. 남의 커밋 위에
          # 내 것을 얹어 다시 시도한다(덮어쓰지 않는다).
          #
          # 예전에는 `git fetch --unshallow` 후 rebase였는데, db-data는 6707커밋
          # (2026-09-04)이라 그 경로가 **실측 142초**다(us_trading.yml이 재둔 값).
          # 이 잡의 예산은 3분이고 정상 런이 이미 105초를 쓴다 — 충돌하면 반드시
          # 잘렸다(09-04 실측 114런 중 6런). 예산을 늘려서 풀 수 없다: 이 타임아웃은
          # 원장 락 리스(4분)보다 짧아야 중복 주문이 안 난다.
          #
          # 그런데 이 스텝이 하는 일은 "남의 최신 상태 위에 내 파일을 얹기"이고,
          # 그건 rebase가 아니라 **다시 clone(depth 1, 약 6초)** 이면 된다. 결과는
          # 같고 비용은 이력 길이와 무관하다. alert_dedup 병합도 매번 최신 원격본과
          # 하게 되어 오히려 정확해진다.
          # `attempt || rc=$?` 형태로 부르면 함수 본문에서 `set -e`가 꺼진다.
          # 그래서 조용히 넘어가면 안 되는 지점은 명시적으로 return한다 —
          # add/commit이 실패했는데 "변경 없음"으로 빠지면 그 사이클의 심 상태가
          # 소리 없이 사라진다.
          # 반환값: 0=성공 2=clone실패(생략) 3=변경없음 1=push충돌 4=git오류
          attempt() {
            rm -rf db_data_repo
            git clone --depth 1 --branch db-data "$REPO_URL" db_data_repo || return 2
            mkdir -p db_data_repo/data
            copied=0
            while IFS= read -r name; do
              [ -n "$name" ] || continue
              [ -f "data/$name" ] || continue
              if [ "$name" = "alert_dedup.json" ]; then
                # writer가 셋인 파일이라 덮어쓰면 남의 억제 기록을 지운다.
                python3 scripts/merge_alert_dedup.py "db_data_repo/data/$name" "data/$name"                   && copied=$((copied+1))                   || echo "[Deploy] 쿨다운 병합 실패"
                continue
              fi
              cp "data/$name" "db_data_repo/data/" && copied=$((copied+1))
            done < data/.lite_deploy_manifest
            echo "[Deploy] 배포 파일 $copied개"
            git -C db_data_repo add -A data/ || return 4
            if git -C db_data_repo diff --cached --quiet; then
              return 3
            fi
            git -C db_data_repo commit -m "chore(trade): sim state $(date +'%Y-%m-%d %H:%M KST')" || return 4
            git -C db_data_repo push origin db-data || return 1
            return 0
          }

          for i in 1 2 3; do
            rc=0
            attempt || rc=$?
            case "$rc" in
              0) echo "[Deploy] push 성공 (시도 $i)"; exit 0 ;;
              2) echo "[Deploy] db-data 브랜치 clone 실패 — 이번 사이클 배포 생략"; exit 0 ;;
              3) echo "No changes to commit"; exit 0 ;;
              4) echo "[Deploy] git add/commit 실패 — 이 사이클 상태가 안 올라간다"; exit 1 ;;
            esac
            echo "[Deploy] push 충돌 — 다시 clone해서 재시도 ($i/3)"
          done
          echo "[Deploy] push 3회 실패"
          exit 1

      # 실패 **연속당 1통**이다. 런마다 보내면 지속 실패에 수백 통이 나가고,
      # 도배는 침묵과 같다 — scripts/notify_workflow_failure.py가 직전 완료 런의
      # 결과를 보고 억제한다. cancelled에는 걸리지 않는다(if: failure()).
      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_FILE: trading.yml
        run: python3 scripts/notify_workflow_failure.py

