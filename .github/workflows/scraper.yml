name: Stock Scraper Schedule

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'data/**'
      - 'trending_*.csv'
      - 'trending_*.xlsx'
      - 'reports.json'
      - '*.md'

jobs:
  scrape-and-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout content
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install openpyxl

      - name: Restore Previous Data (db-data)
        run: |
          mkdir -p data
          
          echo "Restoring data from db-data branch..."
          # Clone db-data branch to a temporary folder
          git clone --depth 1 --branch db-data https://github.com/hoonnamkoong/stockbot.git db_temp
          
          # Restore ALL content from data/ folder (reports.json, trending_*.csv, monthly_*, etc.)
          if [ -d "db_temp/data" ]; then
            cp -r db_temp/data/* data/
            echo "✅ Data restored successfully."
            ls -F data/
          else
            echo "⚠️ No previous data found in db-data branch. Starting fresh."
          fi
          
          # Clean up temp repo
          rm -rf db_temp

      - name: Run Scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: "https://stockbot-phi.vercel.app" 
        run: |
          python scraper.py

      - name: Run Trade Executor (Reservations)
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ACCOUNT_NO: ${{ secrets.KIS_ACCOUNT_NO }}
          KIS_BASE_URL: ${{ secrets.KIS_BASE_URL }}
        run: |
          python src/trade_executor.py

      - name: Commit and Push Data (db-data)
        run: |
          git clone --depth 1 --branch db-data https://github.com/hoonnamkoong/stockbot.git db_repo
          
          # Copy data folder (contains reports.json, monthly reports, etc.)
          cp -r data/ db_repo/
          
          # Copy daily Excel/CSV files from data/ folder to db-data root for backward compatibility
          cp data/trending_*.csv db_repo/ 2>/dev/null || true
          cp data/trending_*.xlsx db_repo/ 2>/dev/null || true
          
          cd db_repo
          git config user.name "StockBot"
          git config user.email "bot@stockbot.com"
          git add .
          git commit -m "data: Update stock data (Isolated Branch)" || exit 0
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/hoonnamkoong/stockbot.git db-data
