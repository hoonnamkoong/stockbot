name: Sentinel-V AI Trader


on:
  schedule:
    - cron: '30 3 * * 1-5'→ Runs at 03:30, Monday through Friday # 매일(월-금) 12:30 KST
  workflow_dispatch:      # 수동 실행 허용


jobs:
  ai_trading:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'


      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f scripts/requirements-scraper.txt ]; then pip install -r scripts/requirements-scraper.txt; fi


      - name: Run Sentinel-V Core
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.features.sentinel_v


      - name: Deploy Data to db-data branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin db-data
          git checkout -f db-data
          git checkout main -- data/
          git add data/*.json data/*.xlsx
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated Data Update: $(date +'%Y-%m-%d %H:%M:%S KST')" && git push origin db-data)
