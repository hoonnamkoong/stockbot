# .github/workflows/us_eod_watchlist.yml
name: US EOD Watchlist (미국 심 감시목록)

# 하루 1회, 미국장 마감(16:00 ET) 이후 안전 마진을 둔 UTC 고정 시각에 돈다.
# 22:00 UTC는 EDT 마감(20:00 UTC)·EST 마감(21:00 UTC) 양쪽을 다 지난 시각이라
# 이 배치 자체는 서머타임 분기가 필요 없다.
on:
  schedule:
    - cron: '0 22 * * 1-5'  # 월~금 22:00 UTC(그날 미국장 마감 다음, 같은 UTC 날짜)
  workflow_dispatch: {}

concurrency:
  group: us-eod-watchlist
  cancel-in-progress: false

jobs:
  watchlist:
    runs-on: ubuntu-latest
    # 최대 1000종목 × (야후 스로틀 0.15s + 요청 지연) + EDGAR 조회 여유.
    timeout-minutes: 40
    env:
      PYTHONPATH: ${{ github.workspace }}
      TZ: Asia/Seoul
    permissions:
      contents: write
      # 감지기가 us_trading.yml 런 목록을 읽는다. permissions를 명시하면 적지 않은
      # 스코프는 none이 되므로, 이게 없으면 조회가 403이고 감지기는 '판정 생략'으로
      # 조용히 지나간다.
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements-trade.txt'

      - name: Install dependencies
        run: pip install -r scripts/requirements-trade.txt

      # 직전 유니버스를 복원한다. 나스닥 스크리너가 소프트 차단되면
      # run_eod_sim_us.resolve_universe가 이걸로 워치리스트를 만든다 —
      # 2026-08-24·25에 이 폴백이 없어 미국 심 3개가 이틀을 워치리스트 없이 보냈다.
      - name: Restore previous universe (db-data)
        run: |
          git fetch --depth 1 origin db-data 2>/dev/null || echo "[Info] db-data 없음"
          git checkout FETCH_HEAD -- data/us_universe.json 2>/dev/null || echo "[Info] 직전 유니버스 없음 — 폴백 불가"
          mkdir -p data

      # 워치리스트 수집(최대 40분)보다 **먼저** 돈다 — 뒤에 두면 알림이 그만큼 늦다.
      #
      # 감지기가 여기 있는 이유: 2026-08-27에 붙인 EOD 미발화 감지기는 장중 루프
      # 안에 있었는데, 미발화가 그 루프 자신에게 일어나자 감지기도 같이 안 돌았다.
      # 이 배치는 하루 1회 cron이고 태스커·trading.yml과 무관한 경로다.
      - name: Check US intraday loop fired
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python scripts/check_us_loop_fired.py

      - name: Run EOD watchlist batch
        # 배치 실패·빈 워치리스트를 텔레그램으로 알린다(scripts/run_eod_sim_us.py).
        # 이 배선이 빠지면 알림 코드가 있어도 한 통도 안 나간다.
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/run_eod_sim_us.py

      - name: Deploy watchlist (db-data)
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git clone --depth 1 --branch db-data \
            https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git db_data_repo || {
            echo "[Deploy] db-data 브랜치 clone 실패"; exit 1; }
          mkdir -p db_data_repo/data
          cp data/sim_us1_minervini_watchlist.json db_data_repo/data/ 2>/dev/null || true
          cp data/sim_us2_donchian_watchlist.json db_data_repo/data/ 2>/dev/null || true
          cp data/sim_us3_liquidity_watchlist.json db_data_repo/data/ 2>/dev/null || true
          cp data/us_universe.json db_data_repo/data/ 2>/dev/null || true
          cd db_data_repo
          git add -A data/
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "chore(us-eod): watchlist $(date +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            if git push origin db-data; then exit 0; fi
            git fetch --unshallow origin db-data 2>/dev/null || git fetch origin db-data
            git pull --rebase origin db-data || { echo "rebase 실패"; exit 1; }
          done
          exit 1

      # 실패 **연속당 1통**이다. 런마다 보내면 지속 실패에 수백 통이 나가고,
      # 도배는 침묵과 같다 — scripts/notify_workflow_failure.py가 직전 완료 런의
      # 결과를 보고 억제한다.
      #
      # 조건이 `failure()`가 아닌 이유: 잡 타임아웃의 결론은 cancelled이고
      # `failure()`는 거기 안 걸린다. 2026-09-01~03 eod_data가 매일 20분
      # 타임아웃에 잘렸고, 같은 날 trading은 114런 중 6런이 3분 예산에
      # 잘렸는데 텔레그램은 한 통도 안 나갔다. `cancelled()`도 **워크플로**
      # 취소를 보는 함수라 잡 타임아웃을 보장하지 못한다 — 취소된 잡에서도
      # 도는 것이 문서화된 건 `always()`뿐이다.
      - name: Notify on failure
        if: always() && job.status != 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_FILE: us_eod_watchlist.yml
        run: python3 scripts/notify_workflow_failure.py
