# src/strategy/us_strategy_manifest.yaml
# ================================================================
# 미국 주식 페이퍼 심 등록부 — src/strategy/strategy_manifest.yaml(국내)과
# 완전히 분리된 파일이다. 이유: src/pipeline/workers/trade_engine.py의
# _run_simulators()가 국내 매니페스트의 active:true 전체를 KIS 실시간가·
# 국내 후보로 돌린다 — US 심을 거기 얹으면 60초 국내 루프가 매 틱마다 US 심에도
# 원화 후보/시세를 먹이려 시도해 조용히 망가진다.
#
# [새 US 심 추가 방법]
#   1. src/strategy/simulators/us_simN_xxx.py 작성(USBaseSimulator 상속)
#   2. 이 파일 simulators 항목에 블록 추가
#   3. python scripts/gen_us_sim_registry.py 실행 → src/lib/us-sim-registry.generated.ts 갱신
# ================================================================

simulators:
  - id: "us_sim1_minervini"
    module: "src.strategy.simulators.us_sim1_minervini"
    class: "USMinerviniSimulator"
    description: "US Sim1 미너비니 추세형 — 추세 템플릿+실적 가속(EPS·매출)+VCP 압축 돌파"
    state_file: "sim_us1minervini_state.json"
    csv_file: "trade_history_sim_us1minervini.csv"
    label: "US 미너비니 추세형 (US Sim 1)"
    display_order: 10
    ui_key: "us_sim1"
    short_desc: "추세 템플릿 + 실적 가속(EPS·매출) + VCP 압축 돌파"
    chart_group: 1
    color: "blue"
    currency: "USD"
    active: true
    tradeable: false  # 페이퍼 관찰 단계

  - id: "us_sim2_donchian"
    module: "src.strategy.simulators.us_sim2_donchian"
    class: "USDonchianSimulator"
    description: "US Sim2 돈치안 채널 돌파 — 20일 채널 상단 돌파 매수, 10일 채널 이탈/2ATR 손절 청산"
    state_file: "sim_us2donchian_state.json"
    csv_file: "trade_history_sim_us2donchian.csv"
    label: "US 돈치안 돌파 (US Sim 2)"
    display_order: 20
    ui_key: "us_sim2"
    short_desc: "20일 채널 상단 돌파 추종 · 10일 채널 이탈/2ATR 손절"
    chart_group: 1
    color: "orange"
    currency: "USD"
    active: true
    tradeable: false  # 페이퍼 관찰 단계 (국내 Sim9-1도 아직 관찰 단계)

  - id: "us_sim3_liquidity"
    module: "src.strategy.simulators.us_sim3_liquidity"
    class: "USLiquidityBaselineSimulator"
    description: "US Sim3 유동성 상위 보유 — 기준선 심. 거래대금 상위 5종목을 20거래일마다 리밸런스, 신호 없음"
    state_file: "sim_us3liquidity_state.json"
    csv_file: "trade_history_sim_us3liquidity.csv"
    label: "US 기준선·유동성 상위 (US Sim 3)"
    display_order: 30
    ui_key: "us_sim3"
    short_desc: "거래대금 상위 5종목 20거래일 리밸런스 · 신호 없는 잣대"
    chart_group: 1
    color: "gray"
    currency: "USD"
    active: true
    tradeable: false  # 잣대용 페이퍼. 다른 US 심의 성과를 재는 기준선이다.
