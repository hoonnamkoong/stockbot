name: EOD Data Collection

# 장 마감 후 데이터 수집 전용 워크플로.
#
# 역할 분리:
#   - scraper.yml : 장중 스크래핑·시뮬·대시보드. 태스커(repository_dispatch/workflow_dispatch)로만 실행.
#   - eod_data.yml: 장 마감 후 KOSPI top100 종가 CSV 수집. cron으로만 실행.
#
# 주 발화 경로는 태스커다(trading.yml → dispatch_eod_data.py, 16:00~17:00 KST 창).
# cron은 백업으로 남는다.
#
# 예전 주석은 "마감 후 작업이라 cron 지연이 무해하다"였는데 그게 틀렸다. 이 배치는
# 심9-1(돈치안)·심11(미너비니)의 **다음 세션 감시목록**을 만든다 — 다음 09:00 KST
# 전에 끝나야 한다. 지연은 평소 40~57분이었다가 2026-08-27부터 11~12시간으로
# 벌어졌고(08-27 18:06 UTC, 08-28 19:16 UTC), 08-27에는 사람이 수동 dispatch해야
# 했다. 같은 날 us_trading의 cron은 아예 0건으로 죽었다.

on:
  schedule:
    - cron: '0 7 * * 1-5'  # 07:00 UTC = KST 16:00 (장 마감 후)
  workflow_dispatch:
    inputs:
      force:
        description: '장중이어도 강제 수집 (당일 행에 현재가가 박힌다)'
        required: false
        default: 'false'

# 태스커(2분 간격)와 cron 백업이 겹칠 수 있다. 중복 런은 db-data push에서 서로
# 밟는다 — 진행 중인 것을 죽이지 않고 뒤에 세운다.
concurrency:
  group: eod-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # 2026-09-01: 이 워크플로만 타임아웃이 없었다(GitHub 기본값 6시간).
    # 그날 KIS 연결이 러너에서 타임아웃 나면서 런이 25분 넘게 매달렸고,
    # **매달린 런이 그날의 재시도를 통째로 막았다** — dispatch_eod_data가
    # `in_progress`를 "지금 돌고 있다"로 보고 생략하기 때문이다.
    # 재시도 창(16:00~23:00)이 아무리 넓어도 앞 런이 안 죽으면 소용없다.
    #
    # 20분: 정상 수집은 3~5분이다. 100종목 × KIS 조회라 여유를 두되,
    # 재시도 간격(25분)보다 짧아야 다음 트리거가 이어받는다.
    timeout-minutes: 20
    # 분봉 잡이 같은 판정을 다시 하지 않게 게이트를 출력으로 올린다.
    outputs:
      run: ${{ steps.gate.outputs.run }}
    env:
      PYTHONPATH: ${{ github.workspace }}
      TZ: Asia/Seoul
    permissions:
      contents: write
      # 실패 알림이 직전 런의 결과를 읽는다(연속 실패 억제).
      actions: read
    steps:
      # 장중에 수집하면 당일 행에 종가가 아닌 현재가가 박힌다.
      # cron은 마감 후에만 발화하지만 수동 실행은 아무 때나 가능하므로 여기서 막는다.
      - name: 장중 여부 판정 (KST 09:00~15:30 = UTC 00:00~06:29)
        id: gate
        run: |
          MINS=$(( 10#$(date -u +%H) * 60 + 10#$(date -u +%M) ))
          if [ "$MINS" -lt 390 ] && [ "${{ github.event.inputs.force }}" != "true" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "[Gate] 장중(UTC $(date -u +%H:%M)) — 종가 수집을 건너뛴다"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "[Gate] 장 마감 후(UTC $(date -u +%H:%M)) — 종가 수집 진행"
          fi

      - name: Checkout content
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        # fetch_kospi_top100.py만 있을 땐 requests·beautifulsoup4면 충분했다.
        # 심9-1 EOD 실행이 붙으면서 src.strategy 패키지를 import하는데, 그 __init__이
        # analyzer·advisor를 즉시 불러 pandas·google-genai까지 끌고 온다. 개별 패키지를
        # 쫓으면 __init__이 바뀔 때마다 조용히 깨지므로 선언된 requirements를 쓴다.
        run: pip install -r scripts/requirements-scraper.txt

      # 토큰의 유일한 발급자는 token_manager다. 여기서는 비공개 레포의 유효 토큰을
      # data/kis_token_cache.json에 내려놓기만 하고, fetch_kospi_top100.py가 그것을 읽는다.
      - name: Manage KIS Token
        if: steps.gate.outputs.run == 'true'
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python scripts/token_manager.py

      # 종목 목록은 네이버 한 곳에서만 나온다. 2026-08-03에 러너에서 네이버가 막히자
      # EOD 런이 통째로 죽었고 심9-1이 하루 실행되지 않았다. 수집 스크립트는 네이버가
      # 막히면 직전 CSV의 종목 구성으로 폴백하는데, 그러려면 그 파일이 러너에 있어야 한다.
      - name: 직전 종가 CSV 확보 (네이버 장애 시 유니버스 폴백용)
        if: steps.gate.outputs.run == 'true'
        run: |
          mkdir -p output
          if git clone --branch db-data --depth 1 \
              https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git prev_repo 2>/dev/null; then
            cp prev_repo/data/kospi_top100_close.csv output/ 2>/dev/null \
              && echo "[폴백준비] 직전 종가 CSV 확보" || echo "[폴백준비] 직전 CSV 없음(최초 실행)"
            rm -rf prev_repo
          else
            echo "[폴백준비] db-data clone 실패 — 폴백 없이 진행한다"
          fi

      - name: Fetch KOSPI top100 close + OHLCV CSV
        if: steps.gate.outputs.run == 'true'
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: PYTHONPATH=. python scratch/fetch_kospi_top100.py

      # 심9-1(돈치안)은 일봉 전략이라 장중 루프에서 빠져 있다(IS_EOD) —
      # 방금 만든 top100 OHLCV로 하루 1회 돌린다. 심11(미너비니)은 08-20
      # 재설계로 여기서 매매를 안 한다 — 감시 목록(sim11_watchlist.json)만
      # 갱신하고, 실제 매수/매도는 장중 1분 루프가 실시간가로 한다
      # (program-trading-parity-mandate, backtest-lookahead-trap 위반 회피).
      # 심11 감시 목록 계산에 KIS 실시간 조회(일봉·실적)가 필요해 KIS 키가 있어야 한다.
      # 상태는 db-data가 원본이므로 실행 전에 내려받고 실행 후 함께 배포한다.
      # 상태를 못 받아오면 실행하지 않는다: 백지 상태로 돌리면 이미 보유 중인
      # 포지션을 잊고 중복 진입하거나 청산 판단을 건너뛴다.
      - name: Run EOD simulators (Sim9-1 Donchian, Sim11 감시목록)
        if: steps.gate.outputs.run == 'true'
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          mkdir -p data
          if git clone --branch db-data --depth 1 \
              https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git state_repo 2>/dev/null; then
            cp state_repo/data/sim_donchian_state.json data/ 2>/dev/null \
              && echo "[EOD] 심9-1 상태 복원" || echo "[EOD] 기존 상태 없음(최초 실행)"
            # 심11 감시 목록이 찍을 "다음 개장일"은 이 달력으로 정한다. 없으면
            # 주말 근사로 떨어져 연휴 직전 배치가 휴장일을 찍는다(그 감시 목록은
            # 아무도 못 읽는다). 원본은 db-data이고 이미 clone했으니 한 줄이면 된다.
            cp state_repo/data/market_calendar.json data/ 2>/dev/null \
              && echo "[EOD] 휴장일 달력 복원" || echo "[EOD] 달력 없음 — 주말 근사로 진행"
            rm -rf state_repo
            PYTHONPATH=. python scripts/run_eod_sims.py || echo "[EOD] 실행 실패 — CSV 배포는 계속한다"
          else
            echo "[EOD] db-data clone 실패 — 심 실행 건너뜀(백지 상태 매매 방지)"
          fi

      - name: Deploy CSV to db-data
        if: steps.gate.outputs.run == 'true'
        run: |
          if [ ! -f output/kospi_top100_close.csv ]; then
            echo "[KOSPI CSV] 파일 없음 - 배포 스킵"
            exit 1
          fi
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git clone --branch db-data --depth 1 \
            https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git db_repo
          cp output/kospi_top100_close.csv db_repo/data/
          # OHLCV는 종가 CSV와 같은 호출에서 나온다. 없으면 수집 코드가 퇴행한 것이므로
          # 조용히 넘기지 않고 로그를 남긴다(종가 배포 자체는 계속한다).
          if [ -f output/ohlcv_top100.csv ]; then
            cp output/ohlcv_top100.csv db_repo/data/
          else
            echo "[OHLCV] 파일 없음 - 종가만 배포한다"
          fi
          cd db_repo
          git add data/kospi_top100_close.csv data/ohlcv_top100.csv 2>/dev/null || git add data/kospi_top100_close.csv
          # 심9-1 상태·매매기록 + 심11 감시목록. 이걸 안 올리면 매일 백지에서
          # 시작해 보유가 사라지거나(심9-1) 내일 장중 루프가 쓸 pivot이
          # 없어진다(심11). git add는 인자로 받은 경로 중 하나라도 없으면
          # 전체를 원자적으로 실패시킨다. sim_donchian_log.json은 실제로
          # 쓰인 적 없는 파일이라 이 파일들을 한 줄로 add하면 그 하나 때문에
          # state.json·CSV까지 매번 조용히 add가 안 됐다(2026-08-05 발견,
          # 심9-1이 매일 실행·매수까지 하고도 db-data에 한 번도 반영되지
          # 못한 원인). 파일별로 나눠서 서로 실패가 전염되지 않게 한다.
          for f in sim_donchian_state.json sim_donchian_log.json trade_history_sim_donchian.csv \
                   sim11_watchlist.json; do
            [ -f "../data/$f" ] && cp "../data/$f" "data/$f" && git add "data/$f"
          done
          if ! git diff --cached --quiet; then
            git commit -m "data: KOSPI top100 종가·OHLCV CSV 갱신 $(date +'%Y-%m-%d KST')"
            git push origin db-data
            echo "[KOSPI CSV] db-data 배포 완료"
          else
            echo "[KOSPI CSV] 변경사항 없음"
          fi

      # 조건이 `failure()`가 아닌 이유: 잡 타임아웃의 결론은 cancelled인데
      # `failure()`는 거기 안 걸린다. 2026-09-01~09-03 이 워크플로가 매일 20분
      # 타임아웃에 잘렸는데 이 스텝은 매번 skipped였고 텔레그램은 한 통도 안
      # 나갔다(8c4d63955가 같은 관찰을 적어 뒀다). `cancelled()`는 **워크플로**
      # 취소를 보는 함수라 잡 타임아웃을 보장하지 못한다. `always()`는 취소된
      # 잡에서도 도는 것이 문서화돼 있고, job.status로 성공만 걸러낸다.
      #
      # 실패 **연속당 1통**이다. 런마다 보내면 지속 실패에 수백 통이 나가고,
      # 도배는 침묵과 같다 — scripts/notify_workflow_failure.py가 직전 완료 런의
      # 결과를 보고 억제한다.
      #
      # 조건이 `failure()`가 아닌 이유: 잡 타임아웃의 결론은 cancelled이고
      # `failure()`는 거기 안 걸린다. 2026-09-01~03 eod_data가 매일 20분
      # 타임아웃에 잘렸고, 같은 날 trading은 114런 중 6런이 3분 예산에
      # 잘렸는데 텔레그램은 한 통도 안 나갔다. `cancelled()`도 **워크플로**
      # 취소를 보는 함수라 잡 타임아웃을 보장하지 못한다 — 취소된 잡에서도
      # 도는 것이 문서화된 건 `always()`뿐이다.
      - name: Notify on failure
        if: always() && job.status != 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_FILE: eod_data.yml
        run: python3 scripts/notify_workflow_failure.py

  # 분봉은 collect의 재시도 예산에 들어갈 수 없다. 2026-08-31 07:00Z 런 실측
  # **30분 13초**(211종목 / 82290행, 콜당 평균 0.66초) — 매달린 게 아니라 원래
  # 30분짜리다. 08-31 15:02Z 런이 9초였던 건 그날 대상이 0종목이어서다.
  #
  # 그래서 8c4d63955의 BUDGET_SEC=360은 고장을 막은 게 아니라 **절단**이다:
  # 종목당 8.6초로 360초면 약 42종목, 오늘 대상 229종목의 18%만 남는다. 분봉은
  # 당일치만 조회되므로 나머지는 영구 손실이고, 이 데이터는 save_minute_bars.py
  # 주석이 "표본을 늘리지 않고 검정력을 올리는 유일한 항목"이라고 적어 둔 그것이다.
  #
  # 예산을 그냥 늘릴 수는 없다 — gh_dispatch.should_skip이 in_progress를 생략으로
  # 보므로 타임아웃은 재시도 간격(25분)보다 짧아야 한다. 40분 잡은 두 조건을
  # 동시에 만족할 수 없어서 잡을 나눈다. collect가 실패하면 이 잡은 needs로
  # skipped라 런이 곧바로 끝나 다음 트리거가 이어받고, collect가 성공하면
  # 재시도가 필요 없으니 45분을 물고 있어도 무해하다.
  #
  # 예산 메커니즘 자체는 8c4d63955 그대로 둔다(부분 저장 + 결손 알림 + `-u`).
  # 3단으로 겹친다: 스크립트 예산 35분 → 바깥 timeout 40분 → 잡 45분.
  #
  # continue-on-error: 분봉 실패로 런 conclusion이 failure가 되면, 이미 배포된
  # 감시목록을 두고 dispatcher가 최대 6번 재시도한다.
  minute_bars:
    needs: collect
    if: needs.collect.outputs.run == 'true'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: ${{ github.workspace }}
      TZ: Asia/Seoul
      MINUTE_BARS_BUDGET_SEC: '2100'
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r scripts/requirements-scraper.txt

      # 토큰의 유일한 발급자는 token_manager다. 이 스텝이 없으면 러너에 캐시가
      # 없어 auth.py의 자가발급 안전망이 매 런 새 토큰을 발급한다.
      - name: Manage KIS Token
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python scripts/token_manager.py

      # 당일 1분봉 저장. KIS 분봉은 **당일치만** 조회되므로 과거로 소급할 수 없다 —
      # 그날 안에 받아두지 않으면 그 하루의 가격 해상도를 영영 잃는다.
      # 신호(순위 차분)는 120초 격자인데 diag 가격은 10분 격자라, 이게 없으면
      # 검정력이 구조적으로 나쁘다.
      - name: Save minute bars (KIS)
        env:
          # 이 스텝은 `|| echo`로 감싸여 있어 실패해도 워크플로가 초록색이다.
          # 전량 결손(토큰 사망)은 그날치를 영구히 잃으므로 사람에게 가야 한다.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ACCOUNT_NO: ${{ secrets.KIS_ACCOUNT_NO }}
          KIS_APP_ACCOUNT: ${{ secrets.KIS_ACCOUNT_NO }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          mkdir -p data
          if git clone --branch db-data --depth 1               https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git money_repo 2>/dev/null; then
            cp money_repo/data/money_*.csv data/ 2>/dev/null || echo "[분봉] 순위 스냅샷 없음(최초 배포)"
            cp money_repo/data/minute_*.csv data/ 2>/dev/null || true
            rm -rf money_repo
          fi
          # `-u`: 09-02 사고 때 이 스텝의 로그가 **한 줄도 없었다**(파이프라인이라
          # stdout이 블록 버퍼링). 어디서 멈췄는지 못 보고 스텝 소요시간 차이로
          # 범인을 좁혀야 했다. 진행이 실시간으로 보이면 다음엔 로그가 말해준다.
          #
          # `timeout`: 진짜 상한은 스크립트 안의 예산(MINUTE_BARS_BUDGET_SEC=2100)이다 —
          # 거기서 멈춰야 받은 데까지 저장하고 알림도 나간다. 이 바깥 상한은
          # 그 예산이 못 도는 경우(콜 하나가 영영 안 끝나는 회귀)에만 걸리도록
          # 넉넉히 뒤에 둔다. `|| echo`는 끝나지 않는 것을 못 막는다 —
          # 0이 아닌 종료만 잡기 때문이다.
          PYTHONPATH=. timeout 2400 python -u scripts/save_minute_bars.py \
            || echo "[분봉] 실패 — 나머지 배포는 계속한다"

      - name: Deploy minute bars to db-data
        run: |
          if ! ls data/minute_*.csv >/dev/null 2>&1; then
            echo "[분봉] 배포할 파일 없음 — 스킵"
            exit 0
          fi
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git clone --branch db-data --depth 1 \
            https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git db_repo
          # 파일별로 나눠서 add한다 — 한 줄로 묶으면 하나가 없을 때 전체가
          # 원자적으로 실패한다(2026-08-05 심9-1 사고와 같은 모양).
          for f in data/minute_*.csv; do
            cp "$f" "db_repo/data/$(basename "$f")" && (cd db_repo && git add "data/$(basename "$f")")
          done
          cd db_repo
          if ! git diff --cached --quiet; then
            git commit -m "data: 1분봉 갱신 $(date +'%Y-%m-%d KST')"
            git push origin db-data
            echo "[분봉] db-data 배포 완료"
          else
            echo "[분봉] 변경사항 없음"
          fi

      - name: Notify on failure
        if: always() && job.status != 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_FILE: eod_data.yml
        run: python3 scripts/notify_workflow_failure.py
