name: Trading Lite (2min)

# 스크래핑과 거래 액션을 분리한 두 워크플로 중 '거래' 쪽이다 (2026-08-06).
#   - trading_lite.yml (2분, 이 파일) : 실전 매매 + 선택 심 페이퍼 갱신
#   - scraper.yml      (10분)         : 스크래핑·AI·국면 갱신·나머지 심·텔레그램
#
# 태스커는 이 워크플로를 tasker_trigger_trade 이벤트로 2분마다 부른다
# (스크래퍼 쪽 tasker_trigger 설정은 그대로 둔다).
#
# 여기서 국면(run_regime_stage)을 갱신하지 않는 이유는 scripts/trade_lite.py 참고 —
# 요약하면 regime_history가 호출마다 누적돼 평활이 왜곡되고, top100 breadth가
# 종목당 1콜이라 2분 주기면 하루 약 19,500 KIS 콜이 된다.
on:
  repository_dispatch:
    types: [tasker_trigger_trade]
  workflow_dispatch:

# lite끼리만 묶는다. scraper.yml과 그룹을 공유하면 스크래퍼가 도는 4~5분 동안
# 들어온 2분 트리거들이 서로를 밀어내며 취소된다(GitHub concurrency는 FIFO 큐가
# 아니라 "실행 중 1개 + 대기 1개"만 유지한다). 두 워크플로가 동시에 도는 경우의
# 안전은 원장 락(program_trader)이 책임진다.
concurrency:
  group: stockbot-lite
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    # 원장 락 리스(_LOCK_LEASE_MIN=4분)보다 짧아야 한다. 리스가 만료될 때까지
    # 살아 있는 런이 있으면 다른 런이 락을 회수해 같은 주문을 낼 수 있다.
    timeout-minutes: 3
    env:
      PYTHONPATH: ${{ github.workspace }}
      TZ: Asia/Seoul
    permissions:
      contents: write
    steps:
      - name: Checkout content
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements-scraper.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f scripts/requirements-scraper.txt ]; then pip install -r scripts/requirements-scraper.txt; fi

      - name: Fetch remote data (db-data)
        run: |
          git fetch origin db-data:db-data 2>/dev/null || echo "[Info] db-data branch does not exist yet"
          if git show-ref --verify refs/heads/db-data 2>/dev/null; then
            git checkout db-data -- data/ 2>/dev/null || echo "[Info] No data folder on db-data yet"
          fi
          mkdir -p data
          echo "[System] Remote data synchronized."

      - name: Manage KIS Token
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python scripts/token_manager.py

      - name: Run Trade Lite
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ACCOUNT_NO: ${{ secrets.KIS_ACCOUNT_NO }}
          KIS_APP_ACCOUNT: ${{ secrets.KIS_ACCOUNT_NO }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_EVENT_NAME: "${{ github.event_name }}"
        run: PYTHONPATH=. python scripts/trade_lite.py

      # 배포 대상은 이 워크플로가 실제로 쓴 것만이다. data/ 전체를 밀면 스크래퍼가
      # 방금 갱신한 파일(스크래핑 산출물·국면·나머지 심 상태)을 런 시작 시점의
      # 낡은 사본으로 되돌린다.
      #
      # 실거래 기록(program_positions.json / order_history.json /
      # trade_history_real.csv)은 여기 없다 — 주문 낸 프로세스가 GitHub API로 직접
      # 쓴다(src/trade/secret_store.py). 그래서 어느 워크플로가 주문했든 writer가 하나다.
      - name: Deploy selected sim paper state (db-data)
        if: success()
        run: |
          # trade_lite.py가 "내가 실제로 쓴 파일"만 적어둔다. 이 목록이 없으면
          # (매매를 안 했거나 페이퍼 동기화를 안 했으면) 배포할 것도 없다.
          #
          # "바뀐 파일을 전부 올린다"로 하면 안 된다 — data/에는 런 시작 시점에 받아온
          # 다른 심들의 사본도 있고, 그 사이 스크래퍼가 그것들을 갱신했다면 낡은
          # 사본으로 되돌리게 된다.
          if [ ! -f data/.lite_deploy_manifest ]; then
            echo "[Deploy] 배포 목록 없음 — 생략"
            exit 0
          fi
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git clone --branch db-data \
            https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git db_data_repo || {
            echo "[Deploy] db-data 브랜치 clone 실패 — 이번 사이클 배포 생략"
            exit 0
          }
          mkdir -p db_data_repo/data
          copied=0
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            [ -f "data/$name" ] || continue
            cp "data/$name" "db_data_repo/data/" && copied=$((copied+1))
          done < data/.lite_deploy_manifest
          echo "[Deploy] 배포 파일 $copied개"
          cd db_data_repo
          git add -A data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore(lite): sim state $(date +'%Y-%m-%d %H:%M KST')"
          # 스크래퍼가 그 사이 push했으면 non-fast-forward가 난다. 남의 커밋 위에
          # 내 것을 얹어 다시 시도한다(덮어쓰지 않는다).
          for i in 1 2 3; do
            if git push origin db-data; then
              echo "[Deploy] push 성공 (시도 $i)"
              exit 0
            fi
            echo "[Deploy] push 충돌 — rebase 후 재시도 ($i/3)"
            git pull --rebase origin db-data || { echo "[Deploy] rebase 실패"; exit 1; }
          done
          echo "[Deploy] push 3회 실패"
          exit 1
