name: Stock Scraper Schedule

on:
  schedule:
    - cron: '0 0-7 * * 1-5' # 9 AM to 4 PM KST (Mon-Fri) [Grand Protocol Verified]
  repository_dispatch:
    types: [tasker_trigger]
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Bypass market holiday check'
        required: false
        default: 'false'
  push:
    branches:
      - main
    paths-ignore:
      - 'data/**'
      - 'trending_*.csv'
      - 'trending_*.xlsx'
      - 'reports.json'
      - '*.md'

jobs:
  scrape-and-report:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    permissions:
      contents: write
    steps:
      - name: Checkout content
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements-scraper.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f scripts/requirements-scraper.txt ]; then pip install -r scripts/requirements-scraper.txt; fi

      - name: Run Scraper
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          # ... (생략된 env는 그대로 유지)
        run: python scripts/scraper.py

      - name: Commit and Push changes
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/*.json data/*.csv data/sync_state.json status.json || true
          git commit -m "[V8.9.9.7] Auto Update: Market Data & AI Analysis" || echo "No changes to commit"
          git push origin main
