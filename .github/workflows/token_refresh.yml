name: Fast Token Refresh

on:
  # 토큰 선발급은 Tasker → /api/cron(평일 07:00 KST)이 담당한다.
  # GitHub cron은 발화가 최대 수시간 지연되어 장 전 발급을 보장하지 못해 제거함.
  repository_dispatch:
    types: [refresh_token]
  workflow_dispatch:
    # Manual trigger allowed

# refresh_token dispatch가 같은 초에 여러 번 도착한다(2026-08-30 2건, 08-23 4건).
# KIS는 발급을 분당 1회로 제한해(EGW00133) 늦게 온 런은 반드시 거부된다. 직렬화하면
# 뒤 런이 형제가 저장소에 넣은 토큰을 확실히 보게 되고, token_manager가 그걸
# 성공으로 처리한다(_token_issued_recently). 진행 중인 런은 죽이지 않는다 —
# 토큰 발급 도중에 끊으면 발급은 됐는데 저장이 안 된 상태가 남는다.
concurrency:
  group: token-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      # token_manager가 토큰을 발급하고 비공개 레포(stockbot-secret)에 직접 기록한다.
      # public db-data로의 push는 더 이상 없다(자격증명 노출 제거).
      - name: Manage KIS Token
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          GH_PAT: ${{ secrets.GH_PAT }}
          FORCE_TOKEN_REFRESH: 'true'
        run: python scripts/token_manager.py

      # 토큰이 발급된 직후에만 달력을 받을 수 있다 (chk-holiday도 토큰이 필요).
      # 달력은 여러 날치(실측 24일)라, 이 런이 하루 실패해도 이전 저장분에 오늘이 들어있다.
      - name: Update market calendar
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: PYTHONPATH=. python scripts/update_market_calendar.py

      # 달력은 자격증명이 아니므로 public db-data에 둔다.
      # 스크래퍼가 시작 시 `git checkout db-data -- data/`로 읽어간다.
      - name: Deploy calendar to db-data
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git clone --branch db-data --depth 1 \
            https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git db_data_repo
          mkdir -p db_data_repo/data
          cp data/market_calendar.json db_data_repo/data/
          cd db_data_repo
          git add data/market_calendar.json
          git diff --staged --quiet || git commit -m "chore(calendar): 개장일 달력 갱신 [skip ci]"
          git push origin db-data
