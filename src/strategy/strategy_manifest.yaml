# ================================================================
# StockBot V50 전략 & 시뮬레이터 등록부 (Strategy Manifest)
# ================================================================
# 이 파일이 전략 및 시뮬레이터의 유일한 등록 진입점입니다.
#
# [새 월별 전략 추가 방법]
#   1. src/strategy/monthly/algo_05_v1.py 파일 생성
#   2. 이 파일 strategies 항목에 한 줄 추가
#   3. active_strategy 값 변경
#   → scraper.py, engine.py 등 다른 파일은 수정 불필요
#
# [새 시뮬레이터 추가 방법]
#   1. src/strategy/simulators/sim4_momentum.py 파일 생성
#   2. 이 파일 simulators 항목에 블록 추가 — 아래 필드를 빠짐없이 채운다
#        id·module·class·description : 실행에 필요
#        state_file·csv_file          : BaseSimulator가 super().__init__("Name")으로
#                                       만드는 경로와 반드시 일치해야 한다
#                                       (sim_{name.lower()}_state.json)
#        label·display_order          : 사람이 보는 이름과 순서. display_order는
#                                       이 파일의 나열 순서(=실행 순서)와 별개다
#        ui_key                       : 통계 API 응답 키(대시보드가 성과를 찾는 이름)
#        short_desc·chart_group·color : 대시보드 표시용. color는 Mantine 팔레트
#                                       이름이고 심마다 달라야 한다(겹치면 순위표
#                                       범례에서 두 심이 같은 색이 된다)
#        analyzer: true               : 매매하지 않는 심(리베로)만
#   3. python scripts/gen_sim_registry.py 실행 → src/lib/sim-registry.generated.ts 갱신
#   → 다른 파일은 수정 불필요. 파이썬은 registry.get_sim_registry(),
#     대시보드는 생성된 TS 상수에서 파생한다.
#   → tests/test_sim_registry_consistency.py가 누락·오타·생성파일 미갱신을 잡는다.
#
# [시뮬레이터 임시 비활성화]
#   해당 시뮬레이터의 active: false 로 변경
#   → 코드 삭제 없이 즉시 비활성화 가능
#
# [프로그램 매매 노출 여부]
#   tradeable: true  → 실전 계좌 '프로그램 선택' 드롭다운에 노출(자동 운용 가능)
#   tradeable: false → 분석기/미매매 심(예: Libero). 프로그램 선택 불가
#   → 이 플래그가 프론트·파이프라인 공통 동적 소스. 심 추가/삭제/변경 시 여기만 수정.
#
# [스크래핑(네이버 게시글) 필요 여부 — needs_buzz]
#   true     → 이 심의 진입 신호가 버즈 후보(게시글 스캔 결과)를 직접 쓴다.
#   false    → get_universe()가 KIS 순위 API로 자체 유니버스를 조회한다. 스크래핑을
#              기다릴 필요가 없다 — 실전 계좌가 이 심을 선택하면 매매를 먼저 내고
#              그 다음에 스크래핑·나머지 심을 돈다(orchestrator 순서 분기).
#   dynamic  → 국면에 따라 필요 여부가 바뀐다(Sim10). 클래스에 반드시
#              `needs_buzz(regime) -> bool` classmethod가 있어야 한다
#              (registry.needs_buzz()가 그 값을 dynamic일 때 호출한다).
#   새 심을 추가하면서 이 필드를 빠뜨리면 registry가 fail-safe로 True(버즈 필요)
#   취급한다 — 신호에 뭘 쓰는지 모르는 채로 스크래핑을 건너뛰는 사고를 막는다.
# ================================================================

# 현재 활성 전략 키 (strategies 항목 중 하나와 일치해야 함)
