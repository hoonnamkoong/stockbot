name: Weekly Report Generation

on:
  schedule:
    - cron: '0 9 * * 5' # Every Friday at 6 PM KST
  workflow_dispatch:

jobs:
  generate-report:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout content
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f scripts/requirements-scraper.txt ]; then pip install -r scripts/requirements-scraper.txt; fi

      - name: Generate and Send Report
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: python src/weekly_reporter.py

      # 실패 **연속당 1통**이다. 런마다 보내면 지속 실패에 수백 통이 나가고,
      # 도배는 침묵과 같다 — scripts/notify_workflow_failure.py가 직전 완료 런의
      # 결과를 보고 억제한다.
      #
      # 조건이 `failure()`가 아닌 이유: 잡 타임아웃의 결론은 cancelled이고
      # `failure()`는 거기 안 걸린다. 2026-09-01~03 eod_data가 매일 20분
      # 타임아웃에 잘렸고, 같은 날 trading은 114런 중 6런이 3분 예산에
      # 잘렸는데 텔레그램은 한 통도 안 나갔다. `cancelled()`도 **워크플로**
      # 취소를 보는 함수라 잡 타임아웃을 보장하지 못한다 — 취소된 잡에서도
      # 도는 것이 문서화된 건 `always()`뿐이다.
      - name: Notify on failure
        if: always() && job.status != 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_FILE: weekly_report.yml
        run: python3 scripts/notify_workflow_failure.py
