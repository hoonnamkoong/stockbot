name: Heartbeat Watch (매매 루프 생존 감시)

# **"지금 멈춰 있다"를 장중에 잡는 유일한 감시자다.**
#
# 이 레포의 고장은 세 종류인데, 지금까지 셋째가 세션 단위로만 보였다:
#   ① 런이 빨갛다              → notify_workflow_failure (빠름)
#   ② 런이 초록인데 안 돌았다   → 산출물 신선도 감사 (하루 1~2회, 세션 단위)
#   ③ 지금 루프가 멎어 있다     → **없었다**
#
# ②의 임계가 세션이라, 09:05에 루프가 멈추면 그 세션이 통째로 끝난 뒤에야
# 결손으로 잡힌다. 2026-09-02의 "07시대 트리거 한 시간 실종"은 어떤 실패
# 목록에도 안 떴다. 상주 워커로 옮기면 이 공백이 최대 위험이 된다 — 상주
# 구조의 고장은 "사이클 하나가 빠졌다"가 아니라 "죽었고 아무도 모른다"다.
#
# [발화는 두 경로다 — 2026-09-16]
# 원래 네이티브 cron 전용이었다. 감시자를 감시 대상과 같은 경로에 두지 않으려는
# 의도였고(폰이 죽으면 감지기도 같이 죽는다 — data_audit_backup.yml이 정확히 그
# 이유로 존재한다) 그 의도는 지금도 맞다. **문제는 발화가 실제로 오지 않았다는
# 것이다.** 09-08~09-15 6거래일 실측: 세션당 7회 기대 대비 하루 정확히 2회
# (12/42 = 28.6%)였고, 뒤엣것은 전부 장 마감 뒤라 판정이 off_session이다
# (09-15 17:14 런). **장중 유효 커버리지 6/42 = 14.3%** — 09:00~11:30과
# 12:00~15:30이 무감시였다. 이 레포에서 시간당 1회도 고빈도이고, 고빈도 cron은
# us_trading에서 이미 통째로 드롭됐다(08-27 이후 0회).
#
# 그래서 태스커 → /api/cron → workflow_dispatch 경로를 **더했다**(장중 30분 격자,
# 창·격자는 src/lib/cron-target.ts의 pickSideWorkflows가 정한다).
#
# [한계 — 지울 수 없다] 이제 주 발화 경로가 감시 대상과 같은 폰에 달려 있다.
# 폰이 멈추면 감시 대상과 감시자가 같이 조용해진다. 아래 cron을 백업으로 남기는
# 이유가 이것이다 — 세션당 1회뿐이라도 폰과 무관한 발화는 그것뿐이고,
# 드롭됐을 때의 실패 모드는 "알림이 안 감"이라 더 나빠지지 않는다.
# 폰 사망 자체를 잡는 느린 그물은 data_audit_backup.yml(13:00 KST cron)이다.
on:
  schedule:
    # 00:00~06:00 UTC = 09:00~15:00 KST, 월~금. **백업 경로다** — 실측 발화는
    # 세션당 2회(장중 1회)이고, 지우면 폰과 무관한 발화가 0이 된다.
    - cron: '0 0-6 * * 1-5'
  # 태스커 → Vercel /api/cron이 쓰는 주 발화 경로. 이게 없으면 dispatch가
  # 422로 실패하고 라우트 로그에만 남는다.
  workflow_dispatch: {}

concurrency:
  group: heartbeat-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: ${{ github.workspace }}
      TZ: Asia/Seoul
    permissions:
      contents: read
      # 감시 대상의 런 이력을 읽는다.
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      # src/market_calendar.py가 requests를 모듈 최상단에서 import한다. 설치 스텝이
      # 없어 러너 이미지에 우연히 들어 있는 날만 통과했다 — 2026-09-07 두 런은
      # `ModuleNotFoundError: No module named 'requests'`로 죽었고 09-08은 돌았다.
      # 감시자가 조용히 죽으면 감시가 없는 것과 같다.
      - name: 의존성 설치
        run: pip install requests

      # 휴장일 판정에 KIS 달력이 필요하다. 없으면 판정이 UNKNOWN이 되고
      # 알림을 보내지 않는다 — 공휴일마다 거짓 경보를 내는 것보다 낫고,
      # 달력 자체의 결손은 신선도 감사가 따로 본다.
      - name: Fetch market calendar (db-data)
        run: |
          git fetch --depth 1 origin db-data:db-data 2>/dev/null || echo "[Info] db-data 없음"
          mkdir -p data
          git checkout db-data -- data/market_calendar.json 2>/dev/null || echo "[Info] 달력 없음 — 판정 불가로 처리된다"

      - name: Check heartbeat
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 -u scripts/check_heartbeat.py

      # 실패 **연속당 1통**. 감시자가 조용히 죽으면 감시가 없는 것과 같다.
      #
      # 조건이 `failure()`가 아닌 이유: 잡 타임아웃의 결론은 cancelled이고
      # `failure()`는 거기 안 걸린다. `cancelled()`도 **워크플로** 취소를 보는
      # 함수라 잡 타임아웃을 보장하지 못한다 — 취소된 잡에서도 도는 것이
      # 문서화된 건 `always()`뿐이다.
      - name: Notify on failure
        if: always() && job.status != 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_FILE: heartbeat_watch.yml
        run: python3 scripts/notify_workflow_failure.py
