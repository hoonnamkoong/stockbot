# .github/workflows/us_trading.yml
name: US Trading (미국 심 페이퍼 매매)

# 주 발화 경로는 태스커다(trading.yml → dispatch_us_trading.py). 여기 cron은
# 태스커가 죽었을 때를 위한 30분 백업이다.
#
# 예전에는 "페이퍼 전용이라 네이티브 cron으로 충분하다"고 봤는데 그게 틀렸다.
# `*/5`는 2026-08-24 하루 18회로 이미 throttle 상태였고, 08-27부터는 **0~1회**로
# 떨어졌다. 남은 런마저 폐장 뒤(22:39/22:44 UTC)라 즉시 종료해 목·금 세션 거래가
# 0건이었다 — 실패가 아니라 미발화라 Actions는 내내 초록이었다. 같은 레포의 하루
# 1회 cron(us_eod_watchlist.yml)은 같은 날 정상 발화했다: 고빈도만 드롭된다.
#
# UTC 13:00~21:30은 EDT 세션(13:30~20:00 UTC)과 EST 세션(14:30~21:00 UTC) 양쪽을
# 덮는 넓은 창이고, 실제 개장 여부는 src/session_gate.py의 zoneinfo 게이트가
# 판정한다 — 이 cron 표현식 자체는 서머타임을 몰라도 된다.
on:
  schedule:
    - cron: '0,30 13-21 * * 1-5'
  workflow_dispatch: {}

concurrency:
  group: us-trading
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    # 워치리스트 상한(MAX_WATCHLIST=300)과 묶여 있다 — 조회 92초 + 셋업 23초 +
    # 배포 충돌 시 142초(push 실패 → unshallow → rebase, 2026-08-26 실측) = 최악 257초.
    # 4분이면 취소되고, 배포가 마지막 스텝이라 그 사이클 판단이 통째로 유실된다.
    # public 레포라 Actions 사용량은 무제한이고, cron이 실제 30분 간격이라 잡이
    # 겹칠 일도 없다. tests/test_us_trading_timeout_budget.py가 이 결합을 지킨다.
    timeout-minutes: 8
    env:
      PYTHONPATH: ${{ github.workspace }}
      TZ: Asia/Seoul
    permissions:
      contents: write
      # 실패 알림이 직전 런의 결과를 읽는다(연속 실패 억제).
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements-trade.txt'

      - name: Install dependencies
        run: pip install -r scripts/requirements-trade.txt

      - name: Fetch remote state (db-data)
        run: |
          git fetch --depth 1 origin db-data:db-data 2>/dev/null || echo "[Info] db-data 없음"
          if git show-ref --verify refs/heads/db-data 2>/dev/null; then
            git checkout db-data -- data/ 2>/dev/null || true
          fi
          mkdir -p data

      - name: Run US trade loop
        # 워치리스트 결손을 텔레그램으로 알린다(scripts/us_trade_loop.py).
        # 이 배선이 빠지면 알림 코드가 있어도 한 통도 안 나간다.
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/us_trade_loop.py

      - name: Deploy state (db-data)
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git clone --depth 1 --branch db-data \
            https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git db_data_repo || {
            echo "[Deploy] clone 실패"; exit 1; }
          mkdir -p db_data_repo/data
          cp data/sim_us1minervini_state.json db_data_repo/data/ 2>/dev/null || true
          cp data/trade_history_sim_us1minervini.csv db_data_repo/data/ 2>/dev/null || true
          cp data/sim_us2donchian_state.json db_data_repo/data/ 2>/dev/null || true
          cp data/trade_history_sim_us2donchian.csv db_data_repo/data/ 2>/dev/null || true
          cp data/sim_us3liquidity_state.json db_data_repo/data/ 2>/dev/null || true
          cp data/trade_history_sim_us3liquidity.csv db_data_repo/data/ 2>/dev/null || true
          # 알림 쿨다운 상태. 이게 왕복하지 않으면 2분마다 새 컨테이너가 빈 상태로
          # 시작해 send_alert_once의 60분 쿨다운이 한 번도 적용되지 않는다 —
          # 2026-09-01에 워치리스트 결손 알림이 세션 내내 2분 간격으로 나갔다.
          # KR장 시간과 겹치지 않아 scraper.yml과 동시에 쓰지 않는다.
          cp data/alert_dedup.json db_data_repo/data/ 2>/dev/null || true
          cd db_data_repo
          git add -A data/
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "chore(us-trade): sim state $(date +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            if git push origin db-data; then exit 0; fi
            git fetch --unshallow origin db-data 2>/dev/null || git fetch origin db-data
            git pull --rebase origin db-data || { echo "rebase 실패"; exit 1; }
          done
          exit 1

      # 실패 **연속당 1통**이다. 런마다 보내면 지속 실패에 수백 통이 나가고,
      # 도배는 침묵과 같다 — scripts/notify_workflow_failure.py가 직전 완료 런의
      # 결과를 보고 억제한다. cancelled에는 걸리지 않는다(if: failure()).
      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_FILE: us_trading.yml
        run: python3 scripts/notify_workflow_failure.py
