name: Monthly Stock Report

on:
  schedule:
    # Run at 00:00 UTC on the 1st of every month
    - cron: '0 0 1 * *'
  workflow_dispatch: # Manual trigger for testing

jobs:
  send-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # 실패 알림이 직전 런의 결과를 읽는다(연속 실패 억제).
      actions: read
    
    steps:
      - name: Checkout content
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install pandas openpyxl requests

      - name: Restore Previous Data (db-data)
        run: |
          mkdir -p data
          git clone --depth 1 --branch db-data https://github.com/hoonnamkoong/stockbot.git db_temp
          cp -r db_temp/data/* data/ 2>/dev/null || true
          rm -rf db_temp

      - name: Generate and Send Report
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          python src/monthly_reporter.py

      - name: Commit and Push Monthly Report (db-data)
        run: |
          git clone --depth 1 --branch db-data https://github.com/hoonnamkoong/stockbot.git db_repo
          cp -r data/ db_repo/
          cd db_repo
          git config user.name "StockBot"
          git config user.email "bot@stockbot.com"
          git add data/monthly_report_*.xlsx
          git status
          git commit -m "data: Update monthly report (Isolated Branch)" || echo "No changes to commit"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/hoonnamkoong/stockbot.git db-data

      # 실패 **연속당 1통**이다. 런마다 보내면 지속 실패에 수백 통이 나가고,
      # 도배는 침묵과 같다 — scripts/notify_workflow_failure.py가 직전 완료 런의
      # 결과를 보고 억제한다. cancelled에는 걸리지 않는다(if: failure()).
      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_FILE: monthly_report.yml
        run: python3 scripts/notify_workflow_failure.py

