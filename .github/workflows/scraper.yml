name: Stock Scraper Schedule

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'data/**'
      - 'trending_*.csv'
      - 'trending_*.xlsx'
      - 'reports.json'
      - '*.md'

jobs:
  scrape-and-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout content
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install openpyxl

      - name: Download Existing Monthly Report
        run: |
          MONTH=$(date -u +"%Y-%m")
          MONTHLY_FILE="monthly_report_${MONTH}.xlsx"
          mkdir -p data
          
          # Try to download existing monthly report from db-data branch
          curl -f -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -o "data/${MONTHLY_FILE}" \
            "https://raw.githubusercontent.com/hoonnamkoong/stockbot/db-data/data/${MONTHLY_FILE}" \
            || echo "[Info] No existing monthly report found for ${MONTH}, will create new one"

      - name: Run Scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: "https://stockbot-phi.vercel.app" 
        run: |
          python scraper.py

      - name: Run Trade Executor (Reservations)
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ACCOUNT_NO: ${{ secrets.KIS_ACCOUNT_NO }}
          KIS_BASE_URL: ${{ secrets.KIS_BASE_URL }}
        run: |
          python src/trade_executor.py

      - name: Commit and Push Data (db-data)
        run: |
          git clone --depth 1 --branch db-data https://github.com/hoonnamkoong/stockbot.git db_repo
          
          # Copy data folder (contains reports.json, monthly reports, etc.)
          cp -r data/ db_repo/
          
          # Copy daily Excel/CSV files from data/ folder to db-data root for backward compatibility
          cp data/trending_*.csv db_repo/ 2>/dev/null || true
          cp data/trending_*.xlsx db_repo/ 2>/dev/null || true
          
          cd db_repo
          git config user.name "StockBot"
          git config user.email "bot@stockbot.com"
          git add .
          git status
          git commit -m "data: Update stock data (Isolated Branch)"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/hoonnamkoong/stockbot.git db-data
