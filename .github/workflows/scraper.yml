name: Stock Scraper Schedule

on:
  workflow_dispatch: # Allow manual trigger via API or UI
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'data/**'
      - 'trending_*.csv'
      - 'trending_*.xlsx'
      - 'reports.json'
      - '*.md'


jobs:
  scrape-and-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout content
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install openpyxl

      - name: Run Scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: "https://stockbot-phi.vercel.app" 
        run: |
          python scraper.py

      - name: Commit and Push Data (db-data)
        run: |
          # ROBUST METHOD: Clone db-data to subdir, copy files, push.
          
          git clone --depth 1 --branch db-data https://github.com/hoonnamkoong/stockbot.git db_repo
          cp -r data/ db_repo/
          cp trending_*.csv db_repo/ || true
          cp trending_*.xlsx db_repo/ || true
          
          cd db_repo
          git config user.name "StockBot"
          git config user.email "bot@stockbot.com"
          git add .
          git commit -m "data: Update stock data (Isolated Branch)" || exit 0
          git push https://${{ secrets.GITHUB_TOKEN }}@github.com/hoonnamkoong/stockbot.git db-data
