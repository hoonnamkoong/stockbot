# ================================================================
# StockBot V50 전략 & 시뮬레이터 등록부 (Strategy Manifest)
# ================================================================
# 이 파일이 전략 및 시뮬레이터의 유일한 등록 진입점입니다.
#
# [새 월별 전략 추가 방법]
#   1. src/strategy/monthly/algo_05_v1.py 파일 생성
#   2. 이 파일 strategies 항목에 한 줄 추가
#   3. active_strategy 값 변경
#   → scraper.py, engine.py 등 다른 파일은 수정 불필요
#
# [새 시뮬레이터 추가 방법]
#   1. src/strategy/simulators/sim4_momentum.py 파일 생성
#   2. 이 파일 simulators 항목에 한 줄 추가
#   → 다른 파일 수정 불필요
#
# [시뮬레이터 임시 비활성화]
#   해당 시뮬레이터의 active: false 로 변경
#   → 코드 삭제 없이 즉시 비활성화 가능
#
# [프로그램 매매 노출 여부]
#   tradeable: true  → 실전 계좌 '프로그램 선택' 드롭다운에 노출(자동 운용 가능)
#   tradeable: false → 분석기/미매매 심(예: Libero). 프로그램 선택 불가
#   → 이 플래그가 프론트·파이프라인 공통 동적 소스. 심 추가/삭제/변경 시 여기만 수정.
# ================================================================

# 현재 활성 전략 키 (strategies 항목 중 하나와 일치해야 함)
active_strategy: "2026-04"

strategies:
  "2026-04":
    module: "src.strategy.monthly.algo_04_v2"
    class: "Algo04V2"
    description: "4월 어텐션 모멘텀 전략 V2"
    author: "StockBot Team"
    since: "2026-04-01"

  # 5월 전략 추가 시 아래 주석 해제 + active_strategy 변경
  # "2026-05":
  #   module: "src.strategy.monthly.algo_05_v1"
  #   class: "Algo05V1"
  #   description: "5월 분산 모멘텀 전략 V1"
  #   author: "StockBot Team"
  #   since: "2026-05-01"

simulators:
  # 이 순서가 곧 실행 순서다(trade_engine._run_simulators가 그대로 순회).
  # sim0_libero는 국면(BULL/SIDEWAYS/BEAR)의 생산자이고 sim6_bear·sim10_orchestrator가
  # 그 결과를 파일로 읽는 소비자다. 생산자가 뒤에 있으면 소비자는 항상 직전 사이클의
  # 국면으로 판단하므로 맨 앞에 둔다. 리베로는 다른 심의 산출물에 의존하지 않는다
  # (루프 전에 계산되는 top100 라이브 breadth만 쓴다).
  - id: "sim0_libero"
    module: "src.strategy.simulators.sim0_libero"
    class: "LiberoSimulator"
    description: "Sim0 리베로 - 시장 국면(BULL/SIDEWAYS/BEAR) 감지 + 전략 추천 (매매 없음)"
    active: true
    tradeable: false  # 분석기(IS_ANALYZER) — 매매 없음, 프로그램 선택 불가

  - id: "sim_psych"
    module: "src.strategy.simulators.sim1_psych"
    class: "PsychDivergenceSimulator"
    description: "심리 폭발형 시뮬레이터 (Buzz & 가격 이격 분석)"
    active: true
    tradeable: true

  - id: "sim_spillover"
    module: "src.strategy.simulators.sim2_spillover"
    class: "SectorSpilloverSimulator"
    description: "섹터 전이형 시뮬레이터 (대장주 추종 & 순환매)"
    active: true
    tradeable: true

  - id: "sim_risk"
    module: "src.strategy.simulators.sim3_risk"
    class: "SmartRiskSimulator"
    description: "스마트 리스크형 시뮬레이터 (추세 추종 & 트레일링 스탑)"
    active: true
    tradeable: true

  - id: "sim4_bull"
    module: "src.strategy.simulators.sim4_bull_momentum"
    class: "BullMomentumSimulator"
    description: "상승장 주도주 탑승형 - 모멘텀 + 불타기 + 고정익절 없이 트레일링 라이딩"
    active: true
    tradeable: true

  - id: "sim5_sideways"
    module: "src.strategy.simulators.sim5_sideways_swing"
    class: "SidewaysSwingSimulator"
    description: "추세 눌림목형 - 상승추세 속 MA5 이하 눌림 저가매수 + 빠른 익절 (구 횡보스윙)"
    active: true
    tradeable: true

  - id: "sim6_bear"
    module: "src.strategy.simulators.sim6_bear_hedge"
    class: "BearHedgeSimulator"
    description: "하락장 줍줍형 - 극단적 현금보유 + 데드캣 반등 2.5% 빠른 익절"
    active: true
    tradeable: true

  - id: "sim4_bull_daytrading"
    module: "src.strategy.simulators.sim4_bull_daytrading"
    class: "BullMomentumDayTradingSimulator"
    description: "상승 모멘텀 단타 — 분할 익절(+5%/+10%) + 2일/5일 강제청산"
    active: true
    tradeable: true

  - id: "sim7_report_follower"
    module: "src.strategy.simulators.sim7_report_follower"
    class: "ReportFollowerSimulator"
    description: "Sim7 리포트 팔로워 — 딥다이브 강력 매수 종목 자동 매수 + 트레일링 라이딩"
    active: true
    tradeable: true

  - id: "sim10_orchestrator"
    module: "src.strategy.simulators.sim10_orchestrator"
    class: "Sim10OrchestratorSimulator"
    description: "Sim10 오케스트레이터 — Sim0 국면(BULL/SIDEWAYS/BEAR)에 따라 전략 파라미터 동적 전환 (300만 독립 운용)"
    active: true
    tradeable: true

  - id: "sim8_accumulation"
    module: "src.strategy.simulators.sim8_accumulation"
    class: "AccumulationSimulator"
    description: "Sim8 선행매집 — 52주 앵커 구간의 외인·기관 선매수 포착 + 매집/돌파 2단 피라미딩"
    active: true
    tradeable: false  # 과거 검증 불가(엑셀에 52주·수급추정 컬럼 없음) — 페이퍼 관찰 단계

  - id: "sim9_gap_fade"
    module: "src.strategy.simulators.sim9_gap_fade"
    class: "GapFadeSimulator"
    description: "Sim9 갭소진 반등 — 갭>=+3% & 장중<=-3%를 14:30 이후 매수 + 익일 청산(타임스탑 1일)"
    active: true
    tradeable: false  # 실측 시가가 09:02 근사였음 — 실제 시가로 재검증 후 승격

  - id: "sim9_1_donchian"
    module: "src.strategy.simulators.sim9_1_donchian"
    class: "DonchianBreakoutSimulator"
    description: "Sim9-1 돈치안 채널 돌파 — 20일 채널 상단 돌파 + 10일 채널 이탈/2*ATR 청산 (Sim5의 정반대)"
    active: true
    tradeable: false  # 과거 검증 불가(엑셀 유니버스가 동적이라 20일 채널 신호 4건) — 페이퍼 관찰
