# .github/workflows/us_trading.yml
name: US Trading (미국 심 페이퍼 매매)

# 주 발화 경로는 태스커다(trading.yml → dispatch_us_trading.py). 여기 cron은
# 태스커가 죽었을 때를 위한 30분 백업이다.
#
# 예전에는 "페이퍼 전용이라 네이티브 cron으로 충분하다"고 봤는데 그게 틀렸다.
# `*/5`는 2026-08-24 하루 18회로 이미 throttle 상태였고, 08-27부터는 **0~1회**로
# 떨어졌다. 남은 런마저 폐장 뒤(22:39/22:44 UTC)라 즉시 종료해 목·금 세션 거래가
# 0건이었다 — 실패가 아니라 미발화라 Actions는 내내 초록이었다. 같은 레포의 하루
# 1회 cron(us_eod_watchlist.yml)은 같은 날 정상 발화했다: 고빈도만 드롭된다.
#
# UTC 13:00~21:30은 EDT 세션(13:30~20:00 UTC)과 EST 세션(14:30~21:00 UTC) 양쪽을
# 덮는 넓은 창이고, 실제 개장 여부는 src/session_gate.py의 zoneinfo 게이트가
# 판정한다 — 이 cron 표현식 자체는 서머타임을 몰라도 된다.
on:
  schedule:
    - cron: '0,30 13-21 * * 1-5'
  workflow_dispatch: {}

concurrency:
  group: us-trading
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    # 워치리스트 상한(MAX_WATCHLIST=300)과 묶여 있다 — 조회 92초 + 셋업 23초 +
    # 배포 충돌 시 142초(push 실패 → unshallow → rebase, 2026-08-26 실측) = 최악 257초.
    # 4분이면 취소되고, 배포가 마지막 스텝이라 그 사이클 판단이 통째로 유실된다.
    # public 레포라 Actions 사용량은 무제한이고, cron이 실제 30분 간격이라 잡이
    # 겹칠 일도 없다. tests/test_us_trading_timeout_budget.py가 이 결합을 지킨다.
    timeout-minutes: 8
    env:
      PYTHONPATH: ${{ github.workspace }}
      TZ: Asia/Seoul
    permissions:
      contents: write
      # 실패 알림이 직전 런의 결과를 읽는다(연속 실패 억제).
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements-trade.txt'

      - name: Install dependencies
        run: pip install -r scripts/requirements-trade.txt

      # 이 루프가 읽는 건 심당 세 파일(감시목록·상태·매매기록)과 알림 쿨다운뿐이다
      # — 2026-11-27 기준 13개 / 약 200KB. 그런데 `git fetch --depth 1` +
      # `git checkout db-data -- data/`는 **트리 전체**를 받는다(실측 42초 / 130MB,
      # 작업 트리로 펴면 713MB·2,471파일). 목록은 등록부에서 파생한다.
      #
      # 그리고 예전 `|| true`가 **fail-open**이었다: 받기에 실패하면 data/가 빈 채로
      # 루프가 돌고, base_simulator가 `if os.path.exists(self.state_file)`이라
      # **네 심 전부 초기 자본으로 리셋**된다. 그 백지가 아래 배포 스텝에 실려
      # db-data의 진짜 이력을 덮는다. "파일이 원격에 없다"(첫 실행)와 "받기에
      # 실패했다"는 다르다 — 헬퍼가 종료코드로 구분한다(2=클론 실패).
      - name: Fetch remote state (db-data)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data
          files="$(python3 scripts/us_db_data_files.py)"
          [ -n "$files" ] || { echo "[Fetch] 복원 목록이 비었다 — 받지 않는다"; exit 1; }
          # shellcheck disable=SC2086
          bash scripts/fetch_db_data_files.sh $files || {
            echo "[Fetch] db-data 복원 실패 — 백지 상태로 심을 돌리지 않는다"; exit 1; }

      - name: Run US trade loop
        # 워치리스트 결손을 텔레그램으로 알린다(scripts/us_trade_loop.py).
        # 이 배선이 빠지면 알림 코드가 있어도 한 통도 안 나간다.
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/us_trade_loop.py

      # 올리는 것은 **이 워크플로가 쓴 것만**이다(scripts/us_db_data_files.py --deploy).
      # 감시목록은 복원 목록에는 있고 배포 목록에는 없다 — 쓰는 쪽은 하루 1회
      # us_eod_watchlist.yml이고, 30분마다 도는 이 런이 올리면 EOD 배치가 방금 쓴
      # 목록을 런 시작 시점 사본으로 되돌린다(2026-09-17 국내에서 터진 모양).
      #
      # 파일명을 박은 `cp` 여덟 줄이 여기 있었다. US 심이 하나 늘면 그 여덟 줄을
      # 고쳐야 했고, 안 고치면 **그 심의 상태만 조용히 안 올라간다** — 2026-08-05
      # 심9-1(매일 매수하고도 db-data에 한 번도 반영되지 못함)과 같은 모양이다.
      - name: Deploy state (db-data)
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

          # 범위를 배포 목록에서 파생시키면 "배포 목록 ⊄ 배포 범위"가 구성적으로
          # 불가능해진다. sparse 범위 밖 경로는 skip-worktree가 걸려 `git add`가
          # **말없이** 무시하므로, 갈리면 런은 초록이고 그 심 상태만 사라진다.
          DEPLOY_LIST="${RUNNER_TEMP:-.}/us_deploy_list.txt"
          python3 scripts/us_db_data_files.py --deploy > "$DEPLOY_LIST"
          [ -s "$DEPLOY_LIST" ] || { echo "[Deploy] 배포 목록 생성 실패"; exit 1; }
          sed 's|^|/|' "$DEPLOY_LIST" > "${DEPLOY_LIST}.pat"

          # 재시도가 rebase가 아니라 **다시 clone**인 이유: db-data는 6,707커밋이라
          # `fetch --unshallow` + rebase가 실측 142초다(2026-08-26). 이 스텝이 하는
          # 일은 "남의 최신 상태 위에 내 파일 얹기"이므로 부분 clone이면 결과가 같고
          # 비용이 이력 길이와 무관하다. 그리고 unshallow는 부분 클론을 되돌려
          # 130MB를 다시 받는다 — 위 절감을 재시도 한 번에 날린다.
          # 반환값: 0=성공 3=변경없음 1=push충돌 2=clone실패 4=git오류
          attempt() {
            rm -rf db_data_repo
            git clone --depth 1 --filter=blob:none --sparse --branch db-data \
              "$REPO_URL" db_data_repo || return 2
            git -C db_data_repo sparse-checkout set --no-cone --stdin \
              < "${DEPLOY_LIST}.pat" || return 4
            mkdir -p db_data_repo/data
            copied=0; absent=0
            while IFS= read -r p; do
              [ -n "$p" ] || continue
              if [ ! -f "$p" ]; then absent=$((absent+1)); continue; fi
              case "$(git -C db_data_repo ls-files -v "$p")" in
                S*) echo "[Deploy] '$p'가 sparse 범위 밖이다 — 올려도 무시된다"
                    return 4 ;;
              esac
              if [ "$p" = "data/alert_dedup.json" ]; then
                # 알림 쿨다운. writer가 셋이라 덮어쓰면 남의 억제 기록을 지운다 —
                # 2026-09-01에 이게 왕복하지 않아 결손 알림이 세션 내내 2분
                # 간격으로 나갔다. 병합 실패는 용인한다(원격의 옛 기록을 지킨다).
                python3 scripts/merge_alert_dedup.py "db_data_repo/$p" "$p" \
                  && copied=$((copied+1)) \
                  || echo "[Deploy] 쿨다운 병합 실패 — 원격 기록을 그대로 둔다"
                continue
              fi
              cp "$p" "db_data_repo/$p" || return 4
              copied=$((copied+1))
            done < "$DEPLOY_LIST"
            echo "[Deploy] 배포 파일 ${copied}개 (미생성 ${absent}개)"
            git -C db_data_repo add -A data/ || return 4
            git -C db_data_repo diff --cached --quiet && return 3
            git -C db_data_repo commit -m "chore(us-trade): sim state $(date +'%Y-%m-%d %H:%M UTC')" || return 4
            git -C db_data_repo push origin db-data || return 1
            return 0
          }

          for i in 1 2 3; do
            rc=0
            attempt || rc=$?
            case "$rc" in
              0) echo "[Deploy] push 성공 (시도 $i)"; exit 0 ;;
              3) echo "No changes"; exit 0 ;;
              2) echo "[Deploy] db-data clone 실패 — 이 사이클 상태가 안 올라간다"; exit 1 ;;
              4) echo "[Deploy] git 작업 실패 — 이 사이클 상태가 안 올라간다"; exit 1 ;;
            esac
            echo "[Deploy] push 충돌 — 다시 clone해서 재시도 ($i/3)"
          done
          echo "[Deploy] push 3회 실패"
          exit 1

      # 실패 **연속당 1통**이다. 런마다 보내면 지속 실패에 수백 통이 나가고,
      # 도배는 침묵과 같다 — scripts/notify_workflow_failure.py가 직전 완료 런의
      # 결과를 보고 억제한다.
      #
      # 조건이 `failure()`가 아닌 이유: 잡 타임아웃의 결론은 cancelled이고
      # `failure()`는 거기 안 걸린다. 2026-09-01~03 eod_data가 매일 20분
      # 타임아웃에 잘렸고, 같은 날 trading은 114런 중 6런이 3분 예산에
      # 잘렸는데 텔레그램은 한 통도 안 나갔다. `cancelled()`도 **워크플로**
      # 취소를 보는 함수라 잡 타임아웃을 보장하지 못한다 — 취소된 잡에서도
      # 도는 것이 문서화된 건 `always()`뿐이다.
      - name: Notify on failure
        if: always() && job.status != 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_FILE: us_trading.yml
        run: python3 scripts/notify_workflow_failure.py
