name: Stock Scraper Schedule

on:
  repository_dispatch:
    types: [tasker_trigger]
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Bypass market holiday check'
        required: false
        default: 'false'
  push:
    branches:
      - main
    paths-ignore:
      - 'data/**'
      - 'trending_*.csv'
      - 'trending_*.xlsx'
      - 'reports.json'
      - '*.md'

jobs:
  scrape-and-report:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    permissions:
      contents: write
    steps:
      - name: Checkout content
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements-scraper.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f scripts/requirements-scraper.txt ]; then pip install -r scripts/requirements-scraper.txt; fi

      - name: Run Scraper
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          # KIS API 계정 정보
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ACCOUNT_NO: ${{ secrets.KIS_ACCOUNT_NO }}
          KIS_APP_ACCOUNT: ${{ secrets.KIS_ACCOUNT_NO }}
          # 기타 설정
          FORCE_RUN: "${{ github.event.inputs.force_run }}"
          GITHUB_EVENT_NAME: "${{ github.event_name }}"
        run: PYTHONPATH=. python scripts/scraper.py

      - name: Deploy Data to db-data branch
        if: success()
        run: |
          # [V8.9.9.16] git 글로벌 설정 먼저 수행
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git config --global init.defaultBranch db-data

          # [핵심 수정] 스크래퍼가 방금 생성한 결과물을 먼저 임시 폴더에 보관
          # (이후 git checkout이 data/를 덮어쓰기 전에 새 파일을 안전하게 보존)
          mkdir -p scraper_output
          cp data/*.json scraper_output/ 2>/dev/null || true
          cp data/*.xlsx scraper_output/ 2>/dev/null || true
          cp data/*.csv scraper_output/ 2>/dev/null || true

          # db-data 브랜치에서 기존 파일 복원 (이력 보존)
          git fetch origin db-data:db-data 2>/dev/null || echo "[Info] db-data branch does not exist yet, will create"

          mkdir -p deploy_staging/data

          if git show-ref --verify refs/heads/db-data 2>/dev/null; then
            git checkout db-data -- data/ 2>/dev/null && cp -r data/* deploy_staging/data/ || true
          fi

          # [핵심] 보관된 스크래퍼 출력물로 덮어쓰기 (최신 상태 우선)
          # JSON: 시뮬레이터 상태, 동기화 상태 (최신이 옳음)
          cp scraper_output/*.json deploy_staging/data/ 2>/dev/null || true
          # XLSX: 월별 누적 엑셀 (스크래퍼가 기존걸 읽어서 누적한 최신버전)
          cp scraper_output/*.xlsx deploy_staging/data/ 2>/dev/null || true
          # CSV: 거래 이력 (append 방식으로 쌓인 최신버전)
          cp scraper_output/*.csv deploy_staging/data/ 2>/dev/null || true

          # 📦 deploy_staging을 새 git 저장소로 만들어 db-data로 push
          cd deploy_staging
          git init
          git checkout -b db-data
          git add .
          git commit -m "[V8.9.9.16] Data Sync: $(date +'%Y-%m-%d %H:%M KST')" || echo "No changes to commit"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -f origin db-data
