name: Fast Token Refresh

on:
  # 토큰 선발급은 Tasker → /api/cron(평일 07:00 KST)이 담당한다.
  # GitHub cron은 발화가 최대 수시간 지연되어 장 전 발급을 보장하지 못해 제거함.
  repository_dispatch:
    types: [refresh_token]
  workflow_dispatch:
    # Manual trigger allowed

# refresh_token dispatch가 같은 초에 여러 번 도착한다(2026-08-30 2건, 08-23 4건).
# KIS는 발급을 분당 1회로 제한해(EGW00133) 늦게 온 런은 반드시 거부된다. 직렬화하면
# 뒤 런이 형제가 저장소에 넣은 토큰을 확실히 보게 되고, token_manager가 그걸
# 성공으로 처리한다(_token_issued_recently). 진행 중인 런은 죽이지 않는다 —
# 토큰 발급 도중에 끊으면 발급은 됐는데 저장이 안 된 상태가 남는다.
concurrency:
  group: token-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    permissions:
      contents: write
      # 실패 알림이 직전 런의 결과를 읽는다(연속 실패 억제).
      actions: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      # token_manager가 토큰을 발급하고 비공개 레포(stockbot-secret)에 직접 기록한다.
      # public db-data로의 push는 더 이상 없다(자격증명 노출 제거).
      - name: Manage KIS Token
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          GH_PAT: ${{ secrets.GH_PAT }}
          FORCE_TOKEN_REFRESH: 'true'
        run: python scripts/token_manager.py

      # refresh_calendar는 기존 달력의 지난 날짜를 합쳐 저장한다. 이 잡은 main을
      # 체크아웃해 로컬에 달력이 없으니 db-data에서 먼저 받는다. 없으면(첫 실행)
      # 새 응답만 저장된다.
      #
      # 달력 한 파일을 받는데 `git fetch --depth=1`은 그 커밋의 **블롭 전부**를
      # 받는다 — 2026-11-27 실측 42초 / 130MB. 부분 클론은 2초 / 426KB다.
      - name: Restore calendar (db-data)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data
          bash scripts/fetch_db_data_files.sh data/market_calendar.json \
            || echo "[Info] db-data 복원 실패"
          [ -f data/market_calendar.json ] || echo "달력 없음 — 새로 만든다"

      # 토큰이 발급된 직후에만 달력을 받을 수 있다 (chk-holiday도 토큰이 필요).
      # 달력은 여러 날치(실측 24일)라, 이 런이 하루 실패해도 이전 저장분에 오늘이 들어있다.
      - name: Update market calendar
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: PYTHONPATH=. python scripts/update_market_calendar.py

      # 달력은 자격증명이 아니므로 public db-data에 둔다.
      # 스크래퍼가 시작 시 `git checkout db-data -- data/`로 읽어간다.
      - name: Deploy calendar to db-data
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          # db-data writer가 아홉이고 전부 concurrency 그룹이 달라 **동시에 돈다**.
          # 재시도가 없으면 `! [rejected] (fetch first)` 한 번에 그 런의 산출물이
          # 사라진다 — eod_data가 2026-11-25에 실제로 그렇게 죽었다.
          #
          # rebase가 아니라 **다시 clone**이다: db-data는 커밋 8,800개가 넘어
          # `fetch --unshallow` 후 rebase가 실측 142초인데(trading.yml 주석),
          # 여기서 하는 일은 "남의 최신 위에 내 파일 얹기"이고 그건 depth 1
          # 재clone이면 된다. 결과는 같고 비용은 이력 길이와 무관하다.
          #
          # 달력 자체는 여러 날치(실측 24일)라 하루 실패를 견디지만,
          # `config/data_freshness.yaml`이 `max_age_sessions: 3`이고 낡으면
          # 휴장 판정이 fail-closed로 **매매를 통째로 멈춘다** — 연속 실패가
          # 그 선을 넘는다. 그래서 조용히 넘기지 않고 세 번 시도한 뒤 실패로 낸다.
          attempt() {
            rm -rf db_data_repo
            git clone --branch db-data --depth 1 "$REPO_URL" db_data_repo || return 2
            mkdir -p db_data_repo/data
            cp data/market_calendar.json db_data_repo/data/ || return 4
            git -C db_data_repo add data/market_calendar.json || return 4
            if git -C db_data_repo diff --staged --quiet; then return 3; fi
            git -C db_data_repo commit -m "chore(calendar): 개장일 달력 갱신 [skip ci]" || return 4
            git -C db_data_repo push origin db-data || return 1
            return 0
          }
          for i in 1 2 3; do
            rc=0
            attempt || rc=$?
            case "$rc" in
              0) echo "[달력] db-data 배포 완료 (시도 $i)"; exit 0 ;;
              3) echo "[달력] 변경사항 없음"; exit 0 ;;
              1) echo "[달력] push 충돌 — 최신 db-data 위에서 다시 시도 ($i/3)" ;;
              2) echo "[달력] db-data clone 실패 ($i/3)" ;;
              *) echo "[달력] git 오류(rc=$rc) — 달력이 db-data에 도달하지 못했다"; exit 1 ;;
            esac
          done
          echo "[달력] 3회 모두 실패 — 달력이 db-data에 도달하지 못했다"
          exit 1

      # 실패 **연속당 1통**이다. 런마다 보내면 지속 실패에 수백 통이 나가고,
      # 도배는 침묵과 같다 — scripts/notify_workflow_failure.py가 직전 완료 런의
      # 결과를 보고 억제한다.
      #
      # 조건이 `failure()`가 아닌 이유: 잡 타임아웃의 결론은 cancelled이고
      # `failure()`는 거기 안 걸린다. 2026-09-01~03 eod_data가 매일 20분
      # 타임아웃에 잘렸고, 같은 날 trading은 114런 중 6런이 3분 예산에
      # 잘렸는데 텔레그램은 한 통도 안 나갔다. `cancelled()`도 **워크플로**
      # 취소를 보는 함수라 잡 타임아웃을 보장하지 못한다 — 취소된 잡에서도
      # 도는 것이 문서화된 건 `always()`뿐이다.
      - name: Notify on failure
        if: always() && job.status != 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_FILE: token_refresh.yml
        run: python3 scripts/notify_workflow_failure.py
